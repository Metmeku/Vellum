<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vellum</title>
<meta name="description" content="Vellum: an offline personal finance manager built for Ethiopia — inflation, gold, birr, iqub and all.">
<meta name="theme-color" content="#16231F">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vellum">
<style>
:root{
  --ground:#ECEFE8;--card:#FAFBF7;--card2:#F2F4EE;--ink:#16231F;--ink2:#4B5A54;--line:#D5DBD2;
  --gold:#A9780F;--goldbg:#F5E9C9;--goldline:#D9B45A;
  --green:#22704A;--greenbg:#DDEFE3;--red:#A8311F;--redbg:#F7E1DC;--amber:#8A5600;--amberbg:#FBEBC9;
  --blue:#1D5A8E;--bluebg:#DFEAF4;--navbg:#16231F;--navink:#C9D3CC;--navact:#F2D58A;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua","Noto Serif",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Ubuntu,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-theme="hc"]){
  --ground:#0E1613;--card:#16211D;--card2:#1C2924;--ink:#E7ECE5;--ink2:#A9B6AF;--line:#2B3A34;
  --gold:#E2B44E;--goldbg:#33290F;--goldline:#7C6224;
  --green:#5CC98E;--greenbg:#173326;--red:#F0806F;--redbg:#3A1C17;--amber:#F0B254;--amberbg:#352712;
  --blue:#7DB4E6;--bluebg:#16283A;--navbg:#0A100E;--navink:#9FAEA6;--navact:#F2D58A;color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0E1613;--card:#16211D;--card2:#1C2924;--ink:#E7ECE5;--ink2:#A9B6AF;--line:#2B3A34;
  --gold:#E2B44E;--goldbg:#33290F;--goldline:#7C6224;
  --green:#5CC98E;--greenbg:#173326;--red:#F0806F;--redbg:#3A1C17;--amber:#F0B254;--amberbg:#352712;
  --blue:#7DB4E6;--bluebg:#16283A;--navbg:#0A100E;--navink:#9FAEA6;--navact:#F2D58A;color-scheme:dark}
:root[data-theme="hc"]{
  --ground:#FFFFFF;--card:#FFFFFF;--card2:#F2F2F2;--ink:#000000;--ink2:#1A1A1A;--line:#000000;
  --gold:#6B4A00;--goldbg:#FFF0C2;--goldline:#000;--green:#005A2B;--greenbg:#D6F5E2;--red:#A00000;--redbg:#FFE0E0;
  --amber:#663D00;--amberbg:#FFE9B8;--blue:#003F80;--bluebg:#DCEBFF;--navbg:#000;--navink:#FFF;--navact:#FFD54A;color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.app{max-width:640px;margin:0 auto;padding:12px 16px calc(104px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;justify-content:space-between;padding:calc(6px + env(safe-area-inset-top)) 0 10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:22px;letter-spacing:.01em}
.brand svg{width:28px;height:28px}
.stage-chip{font-size:14px;padding:6px 12px;border-radius:999px;background:var(--goldbg);color:var(--ink);border:1px solid var(--goldline);text-decoration:none}
h1{font-family:var(--serif);font-weight:500;font-size:28px;line-height:1.15;margin:8px 0 14px}
h2{font-size:18px;font-weight:650;margin:0 0 8px}
h3{font-size:16px;font-weight:650;margin:0 0 6px}
p{margin:0 0 10px}
.sub{color:var(--ink2);font-size:15px}
.real{color:var(--ink2);font-size:14px}
.money{font-family:var(--serif);font-variant-numeric:lining-nums tabular-nums}
.big{font-size:40px;line-height:1.05;font-weight:500;letter-spacing:-.01em}
.mid{font-size:24px;line-height:1.15}
.pos{color:var(--green)}.neg{color:var(--red)}.warn{color:var(--amber)}.goldc{color:var(--gold)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 12px}
.panel.flat{background:transparent;border-style:dashed}
.panel.tight{padding:12px 14px}
.hero{padding:18px 16px 16px;border-radius:18px;border-color:var(--ink);border-width:1.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat .lbl{font-size:14px;color:var(--ink2)}
.stat .val{font-family:var(--serif);font-size:20px;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wrap{flex-wrap:wrap}
.mt{margin-top:12px}.mb0{margin-bottom:0}
hr.rule{border:0;border-top:1px solid var(--line);margin:12px 0}
/* protected vs leaking bar — the signature element */
.leak{margin-top:14px}
.leakbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--card2);border:1px solid var(--line)}
.leakbar span{display:block;height:100%}
.leakbar .p{background:var(--gold)}
.leakbar .l{background:repeating-linear-gradient(135deg,var(--red) 0 6px,color-mix(in srgb,var(--red) 70%,transparent) 6px 12px)}
.leakbar .o{background:var(--ink2);opacity:.35}
.leaklegend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--ink2);margin-top:6px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.drip{font-size:15px;margin-top:8px}
/* lists */
.list{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:14px;color:var(--ink2)}
.item .amt{text-align:right;font-family:var(--serif);font-variant-numeric:tabular-nums;white-space:nowrap}
.item.btnlike{cursor:pointer}
.tag{display:inline-block;font-size:13px;padding:2px 8px;border-radius:6px;background:var(--card2);color:var(--ink2);border:1px solid var(--line)}
.tag.bad{background:var(--redbg);color:var(--red);border-color:transparent}
.tag.good{background:var(--greenbg);color:var(--green);border-color:transparent}
.tag.gold{background:var(--goldbg);color:var(--gold);border-color:transparent}
.tag.amb{background:var(--amberbg);color:var(--amber);border-color:transparent}
/* alerts */
.alert{display:flex;gap:10px;padding:12px;border-radius:10px;margin:0 0 8px;font-size:15px;border-left:4px solid}
.alert.r{background:var(--redbg);border-color:var(--red)}
.alert.a{background:var(--amberbg);border-color:var(--amber)}
.alert.g{background:var(--greenbg);border-color:var(--green)}
.alert.b{background:var(--bluebg);border-color:var(--blue)}
.alert .act{margin-top:6px}
/* progress */
.bar{height:10px;border-radius:5px;background:var(--card2);border:1px solid var(--line);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--green)}
.bar.a>span{background:var(--amber)}.bar.r>span{background:var(--red)}.bar.gold>span{background:var(--gold)}
/* buttons */
.btn{min-height:44px;padding:10px 16px;border-radius:10px;border:1.5px solid var(--ink);background:transparent;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--card)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
:root[data-theme="dark"] .btn.gold{color:#1A1405}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-theme="hc"]) .btn.gold{color:#1A1405}}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.small{min-height:44px;padding:6px 12px;font-size:15px}
.btn.block{width:100%}
.btn.link{border:0;padding:6px 0;color:var(--blue);min-height:44px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
/* forms */
label.f{display:block;margin:0 0 12px}
label.f>span{display:block;font-size:15px;color:var(--ink2);margin-bottom:4px}
input[type=text],input[type=number],input[type=date],input[type=password],input[type=search],select,textarea{width:100%;min-height:48px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-size:16px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none}
.amount-in{font-family:var(--serif);font-size:34px!important;min-height:64px!important;text-align:left}
.check{display:flex;align-items:flex-start;gap:10px;margin:0 0 12px;min-height:44px}
.check input{width:24px;height:24px;margin-top:2px;flex:none;accent-color:var(--ink)}
.seg{display:flex;gap:4px;background:var(--card2);border:1px solid var(--line);padding:4px;border-radius:12px;margin:0 0 14px;overflow-x:auto}
.seg button{flex:1;min-height:44px;border:0;background:transparent;border-radius:9px;padding:6px 10px;cursor:pointer;white-space:nowrap;font-weight:600;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 0 0 1.5px var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.chip{min-height:44px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-size:15px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--card)}
.chip.b-Needs{border-left:5px solid var(--blue)}.chip.b-Wants{border-left:5px solid var(--amber)}.chip.b-Future{border-left:5px solid var(--gold)}
.pipe{font-variant-numeric:tabular-nums;background:var(--card2);border-radius:10px;padding:10px 12px;margin:0 0 12px}
.pipe .between{padding:3px 0;font-size:15px}
.pipe .net{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:700}
.math{font-size:14px;color:var(--ink2);background:var(--card2);border-radius:8px;padding:8px 10px;margin:6px 0 10px;font-variant-numeric:tabular-nums}
details.acc{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 10px}
details.acc>summary{list-style:none;cursor:pointer;padding:14px 16px;min-height:48px;display:flex;justify-content:space-between;align-items:center;font-weight:650}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"+";font-size:22px;color:var(--ink2);font-weight:400}
details.acc[open]>summary::after{content:"–"}
details.acc>.in{padding:0 16px 16px}
.info{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink2);color:var(--ink2);font-size:13px;font-weight:700;cursor:help;margin-left:4px;background:transparent;padding:0;vertical-align:1px}
/* nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--navbg);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.bottom .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
nav.bottom a,nav.bottom button{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--navink);text-decoration:none;font-size:13px;min-height:52px;justify-content:center;background:none;border:0;cursor:pointer}
nav.bottom a[aria-current="page"]{color:var(--navact)}
nav.bottom svg{width:24px;height:24px}
nav.bottom .add{width:60px;height:60px;border-radius:50%;background:var(--navact);color:#16231F;margin:-22px auto 0;box-shadow:0 0 0 5px var(--navbg);min-height:0}
nav.bottom .add svg{width:30px;height:30px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,10,8,.5);z-index:40;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--ground);border-radius:20px 20px 0 0;z-index:50;padding:8px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(102%);transition:transform .22s ease-out,visibility 0s linear .22s;visibility:hidden;max-width:640px;margin:0 auto}
.sheet.on{transform:none;visibility:visible;transition:transform .22s ease-out}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet .shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sheet .shead h2{margin:0;font-size:20px}
.xbtn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-size:22px;line-height:1}
#confirm.sheet{z-index:70}#cscrim{z-index:60}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 12px 10px 16px;border-radius:12px;z-index:80;display:none;align-items:center;gap:12px;max-width:calc(100% - 32px)}
.toast.on{display:flex}
.toast button{background:transparent;border:1.5px solid var(--card);color:var(--card);border-radius:8px;min-height:40px;padding:4px 12px;cursor:pointer;font-weight:600}
.why{font-family:var(--serif);font-size:19px;line-height:1.4;border-left:3px solid var(--gold);padding:2px 0 2px 14px;margin:0}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink2);font-size:11px;font-family:var(--sans)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--ink2);margin-top:6px}
.empty{text-align:center;padding:22px 10px;color:var(--ink2)}
.ladder{list-style:none;padding:0;margin:0}
.ladder li{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.ladder li .n{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.ladder li.done .n{background:var(--ink);color:var(--card);border-color:var(--ink)}
.ladder li.cur .n{background:var(--gold);color:#fff;border-color:var(--gold)}
.ladder li.cur{background:var(--goldbg);margin:0 -10px;padding:8px 10px;border-radius:10px}
.menu a{display:flex;justify-content:space-between;align-items:center;min-height:56px;padding:8px 2px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.menu a:last-child{border-bottom:0}
.menu a .s{display:block;font-size:14px;color:var(--ink2)}
.lock{min-height:100vh;display:flex;flex-direction:column;justify-content:center;max-width:420px;margin:0 auto;padding:24px}
.countdown{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
table.t{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
table.t td,table.t th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
table.t td.r,table.t th.r{text-align:right}
@media (min-width:700px){.app{padding-top:20px}}
@media (max-width:360px){.big{font-size:34px}.grid3{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="root" aria-live="polite"></div>
<nav class="bottom" id="nav" aria-label="Main" hidden>
  <div class="in">
    <a href="#home" data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg>Home</a>
    <a href="#money" data-nav="money"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1.4"/></svg>Money</a>
    <button class="add" id="addBtn" aria-label="Add a transaction"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <a href="#plan" data-nav="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/></svg>Goals</a>
    <a href="#more" data-nav="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>More</a>
  </div>
</nav>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></section>
<div class="scrim" id="cscrim"></div>
<section class="sheet" id="confirm" role="alertdialog" aria-modal="true"></section>
<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button id="toastUndo" hidden>Undo</button></div>

<script>
"use strict";
/* ============================================================
   Vellum — offline-first personal finance for Ethiopia
   All data stays on this device (IndexedDB). No accounts.
   ============================================================ */
const VERSION='1.0.0';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v??'').replace(/,/g,''));return isFinite(n)?n:0};
const r2=n=>Math.round(n*100)/100;
const sum=(a,f)=>a.reduce((t,x)=>t+(typeof f==='function'?f(x):(f?x[f]:x)||0),0);
function localDate(d=new Date()){const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)}
const today=()=>localDate();
const ym=d=>String(d).slice(0,7);
const thisMonth=()=>ym(today());
function monthsBack(n){const out=[];const d=new Date();d.setDate(1);for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);out.push(x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'))}return out}
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const mLabel=m=>MONTHS[+m.slice(5,7)-1]+(m.slice(5,7)==='01'?' '+m.slice(2,4):'');
function fmt(n,d=0){if(!isFinite(n))return '—';return Number(n).toLocaleString('en-US',{maximumFractionDigits:d,minimumFractionDigits:0})}
const birr=n=>fmt(Math.round(n))+' birr';
function fmtC(n){const a=Math.abs(n),s=n<0?'-':'';if(a>=1e9)return s+(a/1e9).toFixed(a>=1e10?0:1).replace(/\.0$/,'')+'B';if(a>=1e6)return s+(a/1e6).toFixed(a>=1e7?0:1).replace(/\.0$/,'')+'M';if(a>=1e3)return s+(a/1e3).toFixed(a>=1e4?0:1).replace(/\.0$/,'')+'k';return s+Math.round(a)}
const pct=(n,d=0)=>isFinite(n)?(n*100).toFixed(d)+'%':'—';
function fmtDate(d){if(!d)return '';const [y,m,dd]=d.split('-');return +dd+' '+MONTHS[+m-1]+' '+y}

/* ---------- Defaults (Nov 2026, all editable in Settings) ---------- */
const DEF={
  name:'',inflation:25,usd:185,eur:200,gbp:235,goldPrice:12000,cbeSavings:5,cbeTime:10,goldAppr:25,reAppr:28,ratesUpdated:'2026-11-12',
  thr40:40,thrHousing:28,thrDebt:36,onePct:1,save50:true,
  capOn:true,capMonthly:40000,capWeekly:10000,capIncrement:10000,
  charityOn:true,charityPct:10,familyMode:'none',familyAmt:0,pyfOn:true,pyfPct:15,debtMode:'none',debtAmt:0,
  tin:'none',taxPct:0,tinTrigger:40000,why:'',impulse:5000,crisis:false,theme:'auto',grossMonthly:0,mortgageThreshold:150000,
  secondaryCurrency:'none',notifyOn:true,notifyTime:'20:00',notifyDaily:true,notifyEvents:true
};
const CUR={birr:'birr',USD:'USD',EUR:'EUR',GBP:'GBP',gold:'g gold'};

let D=null; // the whole state
let dbp=null;
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('vellum',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function kvGet(k){try{dbp=dbp||idb();const db=await dbp;return await new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){const v=localStorage.getItem('vellum_'+k);return v?JSON.parse(v):undefined}}
async function kvSet(k,v){try{dbp=dbp||idb();const db=await dbp;await new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch(e){try{localStorage.setItem('vellum_'+k,JSON.stringify(v))}catch(_){toast('Could not save. Your device storage may be full.')}}}

/* ---------- Encryption at rest (optional passphrase, AES-GCM) ---------- */
let cryptoKey=null,cryptoSalt=null;
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const hasCrypto=()=>!!(window.crypto&&crypto.subtle);
async function deriveKey(pass,salt){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptStr(str){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},cryptoKey,new TextEncoder().encode(str));return {enc:1,salt:b64(cryptoSalt),iv:b64(iv),ct:b64(ct)}}
async function decryptRec(rec,pass){const salt=unb64(rec.salt);const key=await deriveKey(pass,salt);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(rec.iv)},key,unb64(rec.ct));cryptoKey=key;cryptoSalt=salt;return new TextDecoder().decode(pt)}
async function pack(obj){const s=JSON.stringify(obj);return cryptoKey?await encryptStr(s):s}

function upsertSnapshot(){const c=calc();const m=thisMonth();const i=D.snapshots.findIndex(s=>s.m===m);const rec={m,nw:Math.round(c.nw),real:Math.round(c.realNW),a:Math.round(c.totalA),l:Math.round(c.totalL)};if(i>=0)D.snapshots[i]=rec;else D.snapshots.push(rec);D.snapshots.sort((a,b)=>a.m<b.m?-1:1)}

/* ---------- Core calculations ---------- */
function assetBirr(a){if(a.type==='esx'&&num(a.qty)>0)return num(a.qty)*num(a.unitPrice);if(a.type==='gold')return num(a.qty)*D.settings.goldPrice;if(a.type==='fx')return num(a.qty)*rateOf(a.currency||'USD');return num(a.value)}
function yearsHeld(a){if(!a.acquired)return 0;return Math.max(0,(Date.now()-new Date(a.acquired+'T00:00:00').getTime())/31557600000)}
// Real value (brief §6.1): nominal ÷ (1+inflation)^years held — applied to birr money and depreciating goods.
// Gold, foreign cash and real estate are treated as tracking inflation, so real ≈ nominal for them.
function assetReal(a){const t=ATYPES[a.type]||{};const v=assetBirr(a);if(t.birrMoney||t.depr)return v/Math.pow(1+D.settings.inflation/100,yearsHeld(a));return v}
// '__cash' = the automatic "Cash in hand" account, created the first time money moves without any account set up.
function autoCash(){let a=D.assets.find(x=>x.auto&&!x.deleted);if(!a){a={id:uid(),name:'Cash in hand',type:'cash',flavor:'liquid',value:0,acquired:today(),notes:'Created automatically. Edit it to your real balance.',auto:true};D.assets.push(a)}return a}
function applyAccount(accId,birrDelta){if(accId==='__cash'){if(!birrDelta)return;accId=autoCash().id}const a=D.assets.find(x=>x.id===accId&&!x.deleted);if(!a||!birrDelta)return;if(a.type==="gold")a.qty=Math.round((num(a.qty)+birrDelta/D.settings.goldPrice)*1e4)/1e4;else if(a.type==='fx')a.qty=r2(num(a.qty)+birrDelta/rateOf(a.currency||'USD'));else a.value=r2(num(a.value)+birrDelta);a.updated=today()}
const accounts=()=>live(D.assets).filter(a=>ATYPES[a.type]?.acct);
function incomeIn(m){return live(D.income).filter(e=>ym(e.date)===m)}
function expensesIn(m){return live(D.expenses).filter(e=>ym(e.date)===m)}
const catOf=id=>D.categories.find(c=>c.id===id)||{name:'Uncategorised',bucket:'Needs'};
function monthIncome(m){return sum(incomeIn(m),'birr')}
function monthOutflow(m){return sum(expensesIn(m),'birr')+sum(incomeIn(m),e=>(e.ded?.charity||0)+(e.ded?.family||0))}
function monthLifestyle(m){return sum(expensesIn(m).filter(e=>catOf(e.catId).bucket!=='Future'),'birr')}
function monthFuture(m){return iqubContribIn(m)+sum(incomeIn(m),e=>(e.ded?.savings||0)+(e.ded?.debt||0))+sum(expensesIn(m).filter(e=>catOf(e.catId).bucket==='Future'),'birr')}
function goldBoughtIn(m){return sum(D.moves.filter(x=>x.kind==='goldbuy'&&ym(x.date)===m),'birr')}
function weekSpend(){const d=new Date();const day=(d.getDay()+6)%7;const start=localDate(new Date(d.getFullYear(),d.getMonth(),d.getDate()-day));return sum(live(D.expenses).filter(e=>e.date>=start&&catOf(e.catId).bucket!=='Future'),'birr')}
function avgOver(months,f){const vals=months.map(f);const withData=vals.filter(v=>v>0);return withData.length?sum(withData)/withData.length:0}
function prevMonths(n){return monthsBack(n+1).slice(0,n)}
// With no full month of history yet, assume at least the spending cap so runway isn't overstated.
function avgMonthlyOut(){const prev=avgOver(prevMonths(3),monthOutflow);if(prev>0)return prev;const cur=monthOutflow(thisMonth());return Math.max(cur,D.settings.capOn?D.settings.capMonthly:0)}
function grossMonthly(){if(D.settings.grossMonthly>0)return D.settings.grossMonthly;const prev=avgOver(prevMonths(3),monthIncome);return prev>0?prev:monthIncome(thisMonth())}
function buckets(){const ded=k=>sum(live(D.income),e=>e.ded?.[k]||0);const mv=k=>sum(D.moves.filter(x=>x.bucket===k),'birr');return {gold:Math.max(0,r2(ded('savings')-mv('gold'))),debt:Math.max(0,r2(ded('debt')-mv('debt'))),tax:Math.max(0,r2(ded('tax')-mv('tax')))}}
function activeDebts(){return live(D.debts).filter(d=>num(d.balance)>0.5)}
function debtPay(d){return num(d.actualPay)||num(d.minPay)}
function recurringHousing(){return sum(live(D.recurring).filter(r=>catOf(r.catId).housing),'amount')}
function stageFor(nw){return STAGES.find(s=>nw<s.max)||STAGES[10]}
function classFor(nw){let c=CLASSES[0][1];for(const [min,n] of CLASSES)if(nw>=min)c=n;return c}

function calc(){
  const s=D.settings,inf=s.inflation/100,m=thisMonth();
  const V=virtualItems();
  const assets=live(D.assets).map(a=>({a,birr:assetBirr(a),real:assetReal(a),t:ATYPES[a.type]||ATYPES.other})).concat(V.A);
  const debts=activeDebts(),virtL=V.L;
  const totalA=sum(assets,'birr'),totalL=sum(debts,d=>num(d.balance))+sum(virtL,'balance');
  const nw=totalA-totalL,realNW=sum(assets,'real')-totalL;
  const birrMoney=sum(assets.filter(x=>x.t.birrMoney),'birr');
  const protectedV=sum(assets.filter(x=>['gold','fx','realestate'].includes(x.a.type)),'birr');
  const otherV=Math.max(0,totalA-birrMoney-protectedV);
  const monthExp=avgMonthlyOut();
  const liquid=sum(assets.filter(x=>x.t.runway),'birr');
  const crisisLiquid=sum(assets.filter(x=>['cash','gold','fx'].includes(x.a.type)),'birr');
  const tier1=sum(assets.filter(x=>x.t.tier===1),'birr'),tier2=sum(assets.filter(x=>x.t.tier===2),'birr'),tier3=sum(assets.filter(x=>x.t.tier===3),'birr');
  const goldG=sum(assets.filter(x=>x.a.type==='gold'),x=>num(x.a.qty));
  const inc=monthIncome(m),out=monthOutflow(m),fut=monthFuture(m);
  const gross=grossMonthly();
  const debtService=sum(debts,debtPay)+sum(virtL,'pay');
  const housing=recurringHousing()+sum(debts.filter(d=>d.type==='mortgage'||d.housing),debtPay);
  const flavors={liquid:0,illiquid:0,destroyed:0};assets.forEach(x=>flavors[x.a.flavor||x.t.flavor]+=x.birr);
  return {s,inf,assets,debts,virtL,totalA,totalL,nw,realNW,birrMoney,protectedV,otherV,monthExp,liquid,crisisLiquid,tier1,tier2,tier3,goldG,
    runway:monthExp>0?liquid/monthExp:null,inc,out,net:inc-out,fut,savingsRate:inc>0?fut/inc:0,goldThisMonth:goldBoughtIn(m),
    inflLossYear:birrMoney*inf,inflLossDay:birrMoney*inf/365,gross,debtService,dsr:gross>0?debtService/gross:null,housing,housingRatio:gross>0?housing/gross:null,
    flavors,buckets:buckets(),stage:stageFor(nw),cls:classFor(nw)};
}

/* ---------- Income auto-deduction pipeline (§4.2.1) ---------- */
function pipeline(gross,date,excludeId){
  const s=D.settings,d={charity:0,family:0,savings:0,debt:0,tax:0};
  if(gross<=0)return {d,net:0,trimmed:false};
  if(s.charityOn)d.charity=gross*s.charityPct/100;
  if(s.familyMode==='perEntry')d.family=Math.min(s.familyAmt,gross);
  else if(s.familyMode==='monthly'){const used=sum(live(D.income).filter(e=>e.id!==excludeId&&ym(e.date)===ym(date)),e=>e.ded?.family||0);d.family=Math.max(0,Math.min(s.familyAmt-used,gross))}
  if(s.pyfOn)d.savings=gross*s.pyfPct/100;
  if(activeDebts().length){if(s.debtMode==='pct')d.debt=gross*s.debtAmt/100;else if(s.debtMode==='fixed')d.debt=s.debtAmt}
  if(s.tin!=='none'&&s.taxPct>0)d.tax=gross*s.taxPct/100;
  let over=sum(Object.values(d))-gross,trimmed=over>0.001;
  for(const k of ['debt','family','charity','tax','savings']){if(over<=0)break;const cut=Math.min(d[k],over);d[k]-=cut;over-=cut}
  for(const k in d)d[k]=r2(d[k]);
  return {d,net:r2(gross-sum(Object.values(d))),trimmed};
}
function pipelineHTML(gross,p){
  const rows=[['Charity',p.d.charity],['Family support',p.d.family],['Savings → gold',p.d.savings],['Debt repayment',p.d.debt],['Tax reserve',p.d.tax]].filter(r=>r[1]>0);
  return `<div class="pipe" aria-live="polite"><div class="between"><span>Gross earned</span><span class="money">${birr(gross)}</span></div>
  ${rows.map(r=>`<div class="between sub"><span>− ${r[0]}</span><span class="money">${birr(r[1])}</span></div>`).join('')}
  <div class="between net"><span>Net available</span><span class="money pos">${birr(p.net)}</span></div>
  ${p.trimmed?'<div class="sub warn">Deductions were larger than this income, so debt and family were reduced first.</div>':''}</div>`;
}

function streamTotals(days=90){const since=localDate(new Date(Date.now()-days*864e5));const t={};live(D.income).filter(e=>e.date>=since).forEach(e=>t[e.streamId]=(t[e.streamId]||0)+e.birr);return t}
function streamClass(st){if(st.cls&&st.cls!=='auto')return st.cls;const t=streamTotals();const ranked=live(D.streams).filter(s=>s.active!==false).sort((a,b)=>(t[b.id]||0)-(t[a.id]||0));const i=ranked.findIndex(s=>s.id===st.id);return i===0?'primary':i===1?'secondary':'side gig'}

/* ---------- Debt simulation (§6.8) ---------- */
function simulate(debts,extra,order){
  const ds=debts.map(d=>({id:d.id,name:d.name,b:num(d.balance),r:num(d.apr)/1200,min:Math.max(num(d.actualPay)||num(d.minPay),0),done:false,month:null}));
  let month=0,interest=0;const series=[sum(ds,'b')];
  while(ds.some(d=>d.b>0.5)&&month<600){
    month++;let pool=extra+sum(ds.filter(d=>d.done),'min');
    for(const d of ds)if(!d.done){const i=d.b*d.r;d.b+=i;interest+=i}
    for(const d of ds)if(!d.done){const p=Math.min(d.min,d.b);d.b-=p;pool+=d.min-p}
    const act=ds.filter(d=>!d.done&&d.b>0.5).sort(order==='avalanche'?(a,b)=>b.r-a.r||a.b-b.b:(a,b)=>a.b-b.b||b.r-a.r);
    for(const d of act){if(pool<=0)break;const p=Math.min(pool,d.b);d.b-=p;pool-=p}
    for(const d of ds)if(!d.done&&d.b<=0.5){d.done=true;d.b=0;d.month=month}
    series.push(sum(ds,'b'));
  }
  return {months:month,interest,series,stuck:month>=600,order:ds.filter(d=>d.month).sort((a,b)=>a.month-b.month)};
}
function addMonths(n){const d=new Date();d.setMonth(d.getMonth()+n);return MONTHS[d.getMonth()]+' '+d.getFullYear()}

/* ---------- Four questions before borrowing (§3.6) ---------- */
function fourQ({payment,apr,buysAsset,expReturn,excludeId}){
  const c=calc();const existing=sum(activeDebts().filter(d=>d.id!==excludeId),debtPay);
  const q=[];
  q.push({ok:buysAsset===true,text:'Does it buy something that grows in value or earns income?',why:buysAsset?'Yes — it buys a productive or appreciating asset.':'No — this is bad debt. It buys something that loses value or earns nothing.'});
  const spread=num(expReturn)-num(apr);
  q.push({ok:buysAsset&&num(expReturn)>num(apr),text:'Is the interest lower than what the asset will earn?',why:buysAsset?`Expected return ${fmt(num(expReturn),1)}% vs interest ${fmt(num(apr),1)}%: spread ${spread>=0?'+':''}${fmt(spread,1)}%.`:'Not applicable — the money does not buy an asset.'});
  const ratio=c.gross>0?(existing+payment)/c.gross:null;
  q.push({ok:ratio!==null&&ratio<=c.s.thrDebt/100,unknown:ratio===null,text:`Do all your debt payments stay under ${c.s.thrDebt}% of income?`,why:ratio===null?'Unknown — add your typical monthly income in Settings or log some income first.':`All payments would be ${birr(existing+payment)} a month, ${pct(ratio)} of your ${birr(c.gross)} income.`});
  const need=payment*6;
  q.push({ok:c.liquid>=need,text:'Could you keep paying for 6 months with zero income?',why:`You need ${birr(need)} in liquid reserves. You have ${birr(c.liquid)}.`});
  const fails=q.filter(x=>!x.ok).length;
  const verdict=!q[0].ok||fails>=2?'stop':fails===1?'caution':'go';
  return {q,verdict,good:q[0].ok&&q[1].ok};
}
function fourQHTML(r){
  const v={go:['g','Proceed. This debt passes all four tests.'],caution:['a','Proceed with caution. One test failed.'],stop:['r','Do not proceed. This debt is likely to hurt you.']}[r.verdict];
  return `<div class="alert ${v[0]}"><div><strong>${v[1]}</strong></div></div><ul class="list">${r.q.map((x,i)=>`<li class="item"><span aria-hidden="true" class="${x.ok?'pos':x.unknown?'warn':'neg'}" style="font-size:20px;width:22px">${x.ok?'✓':x.unknown?'?':'✗'}</span><div class="grow"><div style="font-weight:600">${i+1}. ${x.text}</div><div class="s">${x.why}</div></div></li>`).join('')}</ul>`;
}

/* ---------- Charts (SVG, fully offline) ---------- */
function lineChart({labels,series,h=180,log=false,ref=null,refLabel=''}){
  const W=340,H=h,pl=46,pr=10,pt=12,pb=24;
  const all=series.flatMap(s=>s.values).concat(ref!=null?[ref]:[]).filter(v=>v!=null&&isFinite(v));
  if(!all.length||labels.length<2)return `<div class="empty">Not enough history yet. This chart fills in as you use Vellum each month.</div>`;
  let mn,mx;if(log){const p=all.filter(v=>v>0);mn=Math.max(1,Math.min(...p));mx=Math.max(...p)}else{mn=Math.min(0,...all);mx=Math.max(...all)}
  const tf=v=>log?Math.log10(Math.max(v,1)):v;const A=tf(mn),B=tf(mx)===A?A+1:tf(mx);
  const x=i=>pl+i*(W-pl-pr)/(labels.length-1),y=v=>pt+(H-pt-pb)*(1-(tf(v)-A)/(B-A));
  let g='';for(let k=0;k<=3;k++){const val=log?Math.pow(10,A+(B-A)*k/3):mn+(mx-mn)*k/3;const yy=y(val);g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${pl-6}" y="${yy+4}" text-anchor="end">${fmtC(val)}</text>`}
  const step=Math.ceil(labels.length/6);labels.forEach((l,i)=>{if(i%step===0||i===labels.length-1)g+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${esc(l)}</text>`});
  if(ref!=null){const yy=y(ref);g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="var(--gold)" stroke-dasharray="2 3" stroke-width="1.5"/><text x="${W-pr}" y="${yy-5}" text-anchor="end" style="fill:var(--gold)">${esc(refLabel)}</text>`}
  series.forEach(s=>{const pts=s.values.map((v,i)=>v==null?null:`${x(i).toFixed(1)},${y(v).toFixed(1)}`);let d='',pen=false;pts.forEach(p=>{if(p){d+=(pen?'L':'M')+p;pen=true}else pen=false});g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.2" ${s.dash?'stroke-dasharray="5 4"':''} stroke-linejoin="round"/>`;const li=s.values.length-1;if(s.values[li]!=null)g+=`<circle cx="${x(li)}" cy="${y(s.values[li])}" r="3.5" fill="${s.color}"/>`});
  const leg=series.filter(s=>s.name).map(s=>`<span><svg width="22" height="10" aria-hidden="true"><line x1="0" x2="22" y1="5" y2="5" stroke="${s.color}" stroke-width="2.4" ${s.dash?'stroke-dasharray="5 4"':''}/></svg> ${esc(s.name)}</span>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(series.map(s=>s.name).join(', '))} chart">${g}</svg>${leg?`<div class="legend">${leg}</div>`:''}`;
}
function barChart({labels,values,h=170,colorFn}){
  const W=340,H=h,pl=46,pr=8,pt=10,pb=24;if(!values.some(v=>v))return `<div class="empty">No data yet for this chart.</div>`;
  const mn=Math.min(0,...values),mx=Math.max(0,...values),rng=mx-mn||1;const y=v=>pt+(H-pt-pb)*(1-(v-mn)/rng);
  const bw=(W-pl-pr)/values.length;let g='';
  for(let k=0;k<=3;k++){const val=mn+rng*k/3;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(val)}" y2="${y(val)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(val)+4}" text-anchor="end">${fmtC(val)}</text>`}
  values.forEach((v,i)=>{const y0=y(0),y1=y(v);g+=`<rect x="${pl+i*bw+bw*.18}" y="${Math.min(y0,y1)}" width="${bw*.64}" height="${Math.max(1,Math.abs(y1-y0))}" rx="2" fill="${colorFn?colorFn(v,i):(v>=0?'var(--green)':'var(--red)')}"><title>${esc(labels[i])}: ${fmt(v)}</title></rect>`});
  const step=Math.ceil(labels.length/6);labels.forEach((l,i)=>{if(i%step===0||i===labels.length-1)g+=`<text x="${pl+i*bw+bw/2}" y="${H-6}" text-anchor="middle">${esc(l)}</text>`});
  g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--ink2)"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart">${g}</svg>`;
}
const PALETTE=['#A9780F','#22704A','#1D5A8E','#A8311F','#6B4FA0','#2C8C8C','#8A5600','#5F6B66','#B5507A','#3F7F2A'];

  if(c.monthExp>0&&c.birrMoney>c.monthExp*1.05){const ex=c.birrMoney-c.monthExp;A.push(['r',`You hold ${birr(c.birrMoney)} in cash and bank — ${birr(ex)} more than one month of spending. That excess loses about ${birr(ex*c.inf/365)} of buying power every day.`,'Move the excess into gold.','buygold'])}
  if(s.capOn){const sp=monthLifestyle(thisMonth()),r=sp/s.capMonthly;if(r>=1)A.push(['r',`You are over your monthly spending cap: ${birr(sp)} of ${birr(s.capMonthly)}.`,'',''] );else if(r>=.8)A.push(['a',`You have used ${pct(r)} of your ${birr(s.capMonthly)} monthly cap.`,`${birr(s.capMonthly-sp)} left this month.`,'']);const w=weekSpend();if(s.capWeekly>0&&w>=s.capWeekly*.8)A.push([w>=s.capWeekly?'r':'a',`This week you have spent ${birr(w)} of your ${birr(s.capWeekly)} weekly cap.`,'',''])}

  if(c.runway!==null&&c.monthExp>0&&c.tier2<c.monthExp*2&&c.totalA>0)A.push(['a',`Your gold covers ${fmt(c.tier2/c.monthExp,1)} months of spending. The target is 2 months.`,'Build your gold reserve.','#emergency']);

  // raise nudge + lifestyle creep
  const pm=prevMonths(3),avgInc=avgOver(pm,monthIncome),curInc=monthIncome(thisMonth());
  if(s.save50&&avgInc>0&&curInc>avgInc*1.1){const raise=curInc-avgInc;A.push(['g',`Your income is up ${birr(raise)} on your recent average. Save half of every raise: put ${birr(raise/2)} into gold, enjoy the rest.`,'','buygold'])}
  const sp=pm.map(monthOutflow),ic=pm.map(monthIncome);if(sp[0]>0&&ic[0]>0&&sp[2]>sp[0]*1.1&&(sp[2]/sp[0])>(ic[2]/ic[0]))A.push(['a','Your spending has grown faster than your income over the last 3 months. That is lifestyle creep.','Hold your cap where it is.','#reports']);

  for(const st of live(D.streams).filter(x=>x.active!==false)){const hist=live(D.income).filter(e=>e.streamId===st.id);if(hist.length&&!hist.some(e=>e.date>=localDate(new Date(Date.now()-60*864e5))))A.push(['b',`${esc(st.name)} has earned nothing for 2+ months. Decide whether to keep it or let it go.`,'','#income'])}

  <section class="panel"><h2>Recent income</h2>${list.length?`<ul class="list">${list.map(e=>txRow({k:'inc',e})).join('')}</ul>`:'<div class="empty">No income logged yet.</div>'}</section>`;
}

/* ---- Expenses ---- */
let expFilter='all';
function viewExpenses(){
  const m=thisMonth();const ex=expensesIn(m);const byB={Needs:0,Wants:0,Future:0};ex.forEach(e=>byB[catOf(e.catId).bucket]+=e.birr);
  const charity=sum(incomeIn(m),e=>e.ded?.charity||0),fam=sum(incomeIn(m),e=>e.ded?.family||0);byB.Needs+=fam;
  const tot=sum(Object.values(byB))+charity;
  const s=D.settings;const inc=monthIncome(m);
  const split=suggestedSplit(grossMonthly());
  let list=[...live(D.income).map(e=>({k:'inc',e,d:e.date,t:e.id})),...live(D.expenses).map(e=>({k:'exp',e,d:e.date,t:e.id}))];
  if(expFilter!=='all')list=list.filter(r=>expFilter==='inc'?r.k==='inc':r.k==='exp'&&catOf(r.e.catId).bucket===expFilter);
  list.sort((a,b)=>b.d.localeCompare(a.d)||b.t.localeCompare(a.t));
  return `${header('Spending')}<p><a href="#more">‹ More</a></p>
  <section class="panel hero"><div class="sub">Out this month</div><div class="money big">${birr(tot)}</div>
  <div class="mt">${['Needs','Wants','Future'].map(b=>`<div class="between"><span>${b}</span><span class="money">${birr(byB[b])} <span class="sub">${inc?pct(byB[b]/inc):''}</span></span></div>`).join('')}${charity?`<div class="between"><span>Charity</span><span class="money">${birr(charity)}</span></div>`:''}</div>
  <p class="real mt mb0">Suggested split at your income: Needs ${split[0]}% · Wants ${split[1]}% · Future ${split[2]}%. Your setting: ${s.splitNeeds??50}/${s.splitWants??30}/${s.splitFuture??20}.</p></section>
  <div class="btnrow" style="margin-bottom:12px"><button class="btn primary" data-act="addexpense">Log spending</button><button class="btn" data-act="recurring">Recurring bills</button><button class="btn" data-act="categories">Categories</button></div>
  <div class="seg" role="group" aria-label="Filter">${[['all','All'],['Needs','Needs'],['Wants','Wants'],['Future','Future'],['inc','Income']].map(([k,l])=>`<button data-efilter="${k}" aria-pressed="${expFilter===k}">${l}</button>`).join('')}</div>
  <section class="panel">${list.length?`<ul class="list">${list.slice(0,80).map(txRow).join('')}</ul>${list.length>80?`<p class="sub">Showing the latest 80 of ${list.length}. Export CSV for the full list.</p>`:''}`:'<div class="empty">Nothing logged yet. Even 5 birr counts.</div>'}</section>`;
}
function suggestedSplit(inc){if(inc<=35000)return [80,15,5];if(inc<=60000)return [65,20,15];if(inc<=100000)return [55,20,25];if(inc<200000)return [48,20,32];return [40,20,40]}

/* ---- Reports ---- */
function viewReports(){
  const tabs=[['networth','Net worth'],['cashflow','Cash flow'],['savings','Savings rate'],['allocation','Allocation'],['income','Income'],['spending','Spending'],['inflation','Inflation loss'],['billion','1 billion']];
  return `${header('Reports')}<p><a href="#more">‹ More</a></p><div class="seg" role="group" aria-label="Report">${tabs.map(([k,l])=>`<button data-rtab2="${k}" aria-pressed="${reportTab===k}">${l}</button>`).join('')}</div><section class="panel">${reportBody()}</section>`;
}
function reportBody(){
  const ms=monthsBack(12),L=ms.map(mLabel),c=calc();
  switch(reportTab){
    case 'networth':{const map=Object.fromEntries(D.snapshots.map(x=>[x.m,x]));return `<h2>Net worth, 12 months</h2>${lineChart({labels:L,series:[{name:'Nominal',color:'var(--ink)',values:ms.map(m=>map[m]?.nw??null)},{name:'Real (inflation-adjusted)',color:'var(--ink2)',dash:true,values:ms.map(m=>map[m]?.real??null)}]})}<p class="sub mt">Net worth is the photo. Vellum records it once a month — open the app at least monthly to keep this chart full.</p>`}
    case 'cashflow':{const v=ms.map(m=>monthIncome(m)-monthOutflow(m));return `<h2>Monthly net cash flow</h2>${barChart({labels:L,values:v})}<table class="t mt"><thead><tr><th>Month</th><th class="r">In</th><th class="r">Out</th><th class="r">Net</th></tr></thead><tbody>${ms.slice(-6).reverse().map(m=>{const i=monthIncome(m),o=monthOutflow(m);return `<tr><td>${mLabel(m)}</td><td class="r">${fmtC(i)}</td><td class="r">${fmtC(o)}</td><td class="r ${i-o>=0?'pos':'neg'}">${fmtC(i-o)}</td></tr>`}).join('')}</tbody></table><p class="sub mt">Cash flow is the movie. It must stay positive.</p>`}
    case 'savings':{return `<h2>Savings rate</h2>${lineChart({labels:L,series:[{name:'Saved for future (%)',color:'var(--gold)',values:ms.map(m=>{const i=monthIncome(m);return i?Math.round(monthFuture(m)/i*100):null})}]})}<p class="sub mt">Aim higher as income grows: 5% at 35k, 15% at 60k, 25% at 100k, 40% at 200k+.</p>`}
    case 'allocation':{return `<h2>By type</h2>${donut(Object.entries(groupBy(c.assets,x=>x.t.label,x=>x.birr)).map(([label,value])=>({label,value})),{center:fmtC(c.totalA)})}<h2 class="mt">By flavor ${info('flavor')}</h2>${donut(['liquid','illiquid','destroyed'].map(f=>({label:FLAVOR[f].label,value:c.flavors[f],color:FLAVOR[f].color})))}`}
    case 'income':{const t=streamTotals(365);return `<h2>Income by stream (12 months)</h2>${donut(live(D.streams).map(s=>({label:s.name,value:t[s.id]||0})))}`}
    case 'spending':{const m=thisMonth();const byC=groupBy(expensesIn(m),e=>catOf(e.catId).name,e=>e.birr);const fam=sum(incomeIn(m),e=>e.ded?.family||0),ch=sum(incomeIn(m),e=>e.ded?.charity||0);if(fam)byC['Family support (pipeline)']=(byC['Family support (pipeline)']||0)+fam;if(ch)byC['Charity']=(byC['Charity']||0)+ch;return `<h2>This month by category</h2>${donut(Object.entries(byC).map(([label,value])=>({label,value})))}<h2 class="mt">Spending, 12 months</h2>${barChart({labels:L,values:ms.map(monthOutflow),colorFn:()=>'var(--ink2)'})}`}
    case 'inflation':{const rows=c.assets.filter(x=>x.t.birrMoney);return `<h2>What inflation is taking</h2><div class="money big neg">${birr(c.inflLossYear)}</div><p class="sub">a year, from ${birr(c.birrMoney)} held in birr at ${c.s.inflation}% inflation. That’s ${birr(c.inflLossYear/12)} a month, ${birr(c.inflLossDay)} a day.</p><div class="math">${birr(c.birrMoney)} × ${c.s.inflation}% = ${birr(c.inflLossYear)}</div>${rows.length?`<table class="t"><thead><tr><th>Account</th><th class="r">Balance</th><th class="r">Loss/yr</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.a.name)}</td><td class="r">${fmt(x.birr)}</td><td class="r neg">${fmt(x.birr*c.inf)}</td></tr>`).join('')}</tbody></table>`:''}<p class="mt">A savings account paying ${c.s.cbeSavings}% still loses about ${c.s.inflation-c.s.cbeSavings}% a year in real terms. Gold keeps pace.</p><button class="btn gold" data-act="buygold">Move birr into gold</button>`}
    case 'billion':{const monthly=monthlySavingsAvg(),r=c.s.goldAppr/100,yrs=yearsTo(1e9,Math.max(0,c.nw),monthly,r);const xs=[...Array(21).keys()];return `<h2>Path to 1 billion birr</h2>${lineChart({labels:xs.map(n=>n?n+'y':'Now'),series:[{name:'Current trajectory',color:'var(--gold)',values:xs.map(n=>fvAt(Math.max(0,c.nw),monthly,r,n))}],log:true,ref:1e9,refLabel:'1B'})}<p class="mt">${yrs===null?'At your current savings, 1 billion is out of reach. Raising income is the lever.':`About <strong>${fmt(yrs,1)} years</strong> at ${birr(monthly)} a month and ${c.s.goldAppr}% growth.`}</p>`}
  }
  return '';
}

  ${card('opp','What does this purchase really cost?',`<form data-calc="opp">${n('amount','Amount (birr)',20000)}<label class="f"><span>How often</span><select name="freq">${opt('once','Once','once')}${opt('daily','Every day','')}${opt('monthly','Every month','')}</select></label>${n('years','Years',10)}<div class="out"></div></form>`)}

function runCalc(form){
  const v=Object.fromEntries([...new FormData(form)].map(([k,x])=>[k,isNaN(parseFloat(x))?x:parseFloat(x)]));const out=$('.out',form);const c=calc(),s=c.s,inf=c.inf;let h='';
  switch(form.dataset.calc){
    case 'borrow':{const pay=amortPayment(v.amount,v.apr,Math.max(1,v.months));const r=fourQ({payment:pay,apr:v.apr,buysAsset:v.buys==='yes',expReturn:v.ret});h=`<div class="math">Monthly payment ≈ ${birr(pay)} · total interest ≈ ${birr(pay*v.months-v.amount)}</div>${fourQHTML(r)}`;break}
    case 'gold':{const loss=v.cash*inf*v.months/12;const goldNow=v.cash/s.goldPrice;h=`<div class="alert ${v.cash>c.monthExp?'r':'g'}"><div><strong>${v.cash>c.monthExp?'Yes — convert everything above one month of spending.':'You are close to the one-month cash buffer. Keep it.'}</strong></div></div><p>Waiting ${v.months} months costs about <strong class="neg">${birr(loss)}</strong> in buying power.</p><div class="math">${birr(v.cash)} × ${s.inflation}% × ${v.months}/12 = ${birr(loss)}</div><p class="sub">Today that buys ${fmt(goldNow,2)} g of gold at ${birr(s.goldPrice)}/g. If you wait and gold rises ${s.goldAppr}% a year, the same birr buys only ${fmt(v.cash/(s.goldPrice*Math.pow(1+s.goldAppr/100,v.months/12)),2)} g.</p>`;break}
    case 'car':{const after=v.price*Math.pow(.7,3),run=v.run*36,gold=v.price*Math.pow(1+s.goldAppr/100,3);const ok=c.nw>=50e6&&v.price<=c.nw*.1;h=`<table class="t"><tbody><tr><td>Car value after 3 years (−30%/yr)</td><td class="r">${birr(after)}</td></tr><tr><td>Running costs over 3 years</td><td class="r neg">${birr(run)}</td></tr><tr><td>Same money in gold after 3 years</td><td class="r pos">${birr(gold)}</td></tr><tr><td><strong>Gap</strong></td><td class="r"><strong>${birr(gold-after+run)}</strong></td></tr></tbody></table><div class="alert ${ok?'g':'r'} mt"><div><strong>${ok?'You can afford it by Vellum’s rule.':'Not yet.'}</strong> Buy a car only when net worth is above 50,000,000 birr and the car is under 10% of it. Your net worth: ${birr(c.nw)}.</div></div>`;break}
    case 'apt':{const P=v.price*(1-v.down/100),pay=amortPayment(P,v.rate,v.years*12),lim=v.income*s.thrHousing/100;const ok=pay<=lim;h=`<div class="math">Loan ${birr(P)} at ${v.rate}% over ${v.years} years → ${birr(pay)} a month. ${s.thrHousing}% of income is ${birr(lim)}.</div><div class="alert ${ok?'g':'r'}"><div><strong>${ok?'Passes the 28% housing rule.':'House-rich, cash-poor trap.'}</strong> ${ok?'Also check that total debt stays under '+s.thrDebt+'% and you keep 6 months of reserves.':`The payment is ${pct(pay/v.income)} of income${pay>v.income?' — more than you earn':''}. Rent instead and put the difference into gold until you can buy with a 40–50% down payment.`}</div></div>${v.income<s.mortgageThreshold?`<p class="sub">Below about ${birr(s.mortgageThreshold)} a month in income, renting usually wins in Ethiopia right now.</p>`:''}`;break}
    case 'phone':{const lim=Math.max(0,c.nw)*s.onePct/100;h=`<div class="alert ${v.price<=lim?'g':'r'}"><div><strong>${v.price<=lim?'Within your 1% rule.':'Over your 1% rule.'}</strong> Depreciating goods should cost no more than ${s.onePct}% of net worth: ${birr(lim)} for you.</div></div><p class="sub">${v.price>lim?'A reliable mid-range or used model does the same job. ':''}In 10 years in gold, ${birr(v.price)} could become ${birr(v.price*Math.pow(1+s.goldAppr/100,10))}.</p>`;break}
    case 'move':{const r=v.rent/v.income;h=`<div class="alert ${r<=s.thrHousing/100?'g':'r'}"><div><strong>Rent would be ${pct(r)} of income.</strong> ${r<=s.thrHousing/100?'That fits under 28%.':'Above 28% — look for something smaller.'}</div></div><p class="sub">Your peace of mind is part of “survive first.” A breathable, modest place you can afford beats a 2–3 bedroom flat for one person. Keep 6 months of reserve before you sign the lease: ${birr(c.monthExp*6+v.rent*6)}.</p>`;break}
    case 'opp':{const n=v.years,g=s.goldAppr/100;let direct,fv;if(v.freq==='once'){direct=v.amount;fv=v.amount*Math.pow(1+g,n)}else{const yearly=v.amount*(v.freq==='daily'?365:12);direct=yearly*n;fv=yearly*((Math.pow(1+g,n)-1)/g)}h=`<p>Direct cost: <strong>${birr(direct)}</strong></p><p>In gold at ${s.goldAppr}% a year for ${n} years it could have become <strong class="goldc">${birr(fv)}</strong>. ${info('opp')}</p><p class="sub">Is this purchase worth that?</p>`;break}
    case 'compound':{const r=v.r/100,mr=r/12,nm=v.years*12;const fv=v.p*Math.pow(1+r,v.years)+(mr?v.pmt*((Math.pow(1+mr,nm)-1)/mr):v.pmt*nm);const real=fv/Math.pow(1+inf,v.years);const put=v.p+v.pmt*nm;h=`<table class="t"><tbody><tr><td>You put in</td><td class="r">${birr(put)}</td></tr><tr><td>Nominal value</td><td class="r">${birr(fv)}</td></tr><tr><td>Real value (today’s money)</td><td class="r ${real<put?'neg':'pos'}">${birr(real)}</td></tr><tr><td>Lost to inflation</td><td class="r neg">${birr(fv-real)}</td></tr></tbody></table><p class="mt">${info('r72')} At ${v.r}% your money doubles every ${v.r>0?fmt(72/v.r,1):'∞'} years. At ${s.inflation}% inflation, prices double every ${fmt(72/s.inflation,1)} years. Real return: ${fmt(v.r-s.inflation,1)}%.</p>`;break}
    case 'roi':{const roi=(v.end-v.start)/v.start,ann=Math.pow(v.end/v.start,1/Math.max(v.years,.01))-1,apy=Math.pow(1+v.apr/100/v.n,v.n)-1;h=`<table class="t"><tbody><tr><td>ROI ${info('roi')}</td><td class="r">${pct(roi,1)}</td></tr><tr><td>Annualized ROI</td><td class="r">${pct(ann,1)}</td></tr><tr><td>Real annual return</td><td class="r ${ann-inf<0?'neg':'pos'}">${pct(ann-inf,1)}</td></tr><tr><td>APR ${v.apr}% → APY ${info('apy')}</td><td class="r">${pct(apy,2)}</td></tr></tbody></table>`;break}
    case 'suitcase':{const fee=v.owe-v.principal,apr=fee/v.principal*365/v.days,profit=v.sell-v.owe,roi=profit/v.principal,ann=roi*365/v.days;h=`<table class="t"><tbody><tr><td>Effective APR</td><td class="r neg">${pct(apr)}</td></tr><tr><td>Profit after repaying</td><td class="r ${profit>=0?'pos':'neg'}">${birr(profit)}</td></tr><tr><td>Return on borrowed goods (annualized)</td><td class="r">${pct(ann)}</td></tr></tbody></table><div class="math">APR = (${fmt(fee)} ÷ ${fmt(v.principal)}) × (365 ÷ ${v.days})</div><div class="alert ${ann>apr&&profit>0?'g':'r'}"><div><strong>${ann>apr&&profit>0?'Good debt: your return beats the credit cost.':'Bad deal: the markup doesn’t cover the credit cost.'}</strong>${ann>apr&&profit>0?' The high APR doesn’t matter if the goods actually sell in time.':''}</div></div>`;break}
    case 'iqub':{const P=v.c*v.members,N=v.members,M=Math.min(v.turn,N),paid=M*v.c,owe=(N-M)*v.c,principal=P-paid,saved=principal*v.apr/100*(N-M)/12;h=`<table class="t"><tbody><tr><td>Pool you receive</td><td class="r">${birr(P)}</td></tr><tr><td>Paid in before your turn</td><td class="r">${birr(paid)}</td></tr><tr><td>Still to pay after</td><td class="r">${birr(owe)}</td></tr><tr><td>Interest-free advance</td><td class="r">${birr(Math.max(0,principal))}</td></tr><tr><td>Interest saved vs ${v.apr}% loan</td><td class="r pos">${birr(Math.max(0,saved))}</td></tr></tbody></table><p class="sub mt">When your turn comes, convert the pool to gold or a productive asset — don’t spend it.</p>`;break}
  }
  out.innerHTML=h;
}

/* ---- Tax ---- */
function scheduleA(gross){const pension=gross*.07,taxable=gross-pension;let tax=0,prev=0,marg=0;const rows=[];for(const [lim,rate] of BRACKETS){if(taxable>prev){const part=Math.min(taxable,lim)-prev;tax+=part*rate;if(part>0){rows.push([prev,Math.min(taxable,lim),rate,part*rate]);marg=rate}}prev=lim}return {pension,taxable,tax,net:gross-pension-tax,eff:gross?tax/gross:0,marg,rows}}
function viewTax(){
  const s=D.settings;
  return `${header('Tax')}<p><a href="#more">‹ More</a></p><div class="alert b"><div>Estimates for learning and planning. Confirm with a licensed Ethiopian accountant and current ERCA rules — brackets change.</div></div>

  <details class="acc"><summary>Business tax (Schedules B and C)</summary><div class="in"><form data-tax="b"><label class="f"><span>Annual revenue</span><input type="number" name="rev" value="600000"></label><label class="f"><span>Cost of goods sold</span><input type="number" name="cogs" value="350000"></label><label class="f"><span>Other deductible expenses</span><input type="number" name="opex" value="60000"></label><div class="out"></div></form></div></details>
  <details class="acc"><summary>VAT or turnover tax</summary><div class="in"><form data-tax="v"><label class="f"><span>Monthly sales (birr, before VAT)</span><input type="number" name="sales" value="50000"></label><label class="f"><span>VAT paid on your purchases this month</span><input type="number" name="input" value="4000"></label><div class="out"></div></form></div></details>

function runTax(form){
  const v=Object.fromEntries([...new FormData(form)].map(([k,x])=>[k,num(x)]));const out=$('.out',form);let h='';
  if(form.dataset.tax==='a'){const r=scheduleA(v.g);h=`<table class="t"><tbody><tr><td>Pension (7%)</td><td class="r">−${birr(r.pension)}</td></tr><tr><td>Taxable</td><td class="r">${birr(r.taxable)}</td></tr>${r.rows.map(x=>`<tr><td class="sub">${fmt(x[0])}–${fmt(x[1])} at ${x[2]*100}%</td><td class="r sub">${fmt(x[3],2)}</td></tr>`).join('')}<tr><td>Income tax</td><td class="r neg">−${birr(r.tax)}</td></tr><tr><td><strong>Take-home</strong></td><td class="r pos"><strong>${birr(r.net)}</strong></td></tr></tbody></table><p class="sub mt">Effective rate ${pct(r.eff,1)} · marginal rate ${pct(r.marg)} · employer adds 11% (${birr(v.g*.11)}) to your pension.</p>`}
  if(form.dataset.tax==='b'){const p=v.rev-v.cogs-v.opex,t=Math.max(0,p)*.3;h=`<table class="t"><tbody><tr><td>Net profit</td><td class="r">${birr(p)}</td></tr><tr><td>Tax at 30%</td><td class="r neg">${birr(t)}</td></tr><tr><td><strong>After-tax profit</strong></td><td class="r pos"><strong>${birr(p-t)}</strong></td></tr></tbody></table>${v.rev>=500000?'<div class="alert r mt"><div>Revenue is at or above 500,000 birr: VAT registration is mandatory.</div></div>':''}`}
  if(form.dataset.tax==='v'){const out15=v.sales*.15,net=out15-v.input,tt=v.sales*.02;h=`<table class="t"><tbody><tr><td>If VAT-registered: VAT collected (15%)</td><td class="r">${birr(out15)}</td></tr><tr><td>minus VAT you paid</td><td class="r">−${birr(v.input)}</td></tr><tr><td><strong>VAT to remit this month</strong></td><td class="r"><strong>${birr(net)}</strong></td></tr><tr><td>If not VAT-registered: turnover tax (2%)</td><td class="r">${birr(tt)}</td></tr></tbody></table>`}
  if(form.dataset.tax==='p'){const yr=v.g*.18*12,cum=yr*v.y;const pens=15000;h=`<p>You put in ${birr(v.g*.07)} and your employer ${birr(v.g*.11)} each month — ${birr(yr)} a year, about ${birr(cum)} over ${v.y} years.</p><div class="alert a"><div>A fixed pension shrinks fast at ${D.settings.inflation}% inflation: ${birr(pens)} a month today is worth about ${birr(pens/Math.pow(1+D.settings.inflation/100,15))} in 15 years. Build gold and property alongside it.</div></div>`}
  out.innerHTML=h;
}

function runRecurring(){
  const m=thisMonth(),day=+today().slice(8,10);let added=0;
  for(const r of live(D.recurring)){
    // fill each month from the month after r.last up to now when the day has passed
    const months=monthsBack(13).filter(x=>(!r.last||x>r.last)&&(x<m||(x===m&&day>=r.day)));
    for(const x of months){D.expenses.push({id:uid(),amount:r.amount,currency:'birr',birr:r.amount,catId:r.catId,date:`${x}-${String(r.day).padStart(2,'0')}`,method:'Cash',accId:'',layer:'Keep',notes:(r.note||'')+' (recurring)',recurringId:r.id,created:new Date().toISOString()});r.last=x;added++}
  }
  return added;
}

function dayDiff(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5)}
function addPeriods(start,n,freq){const d=new Date(start+'T00:00:00');if(freq==='weekly')d.setDate(d.getDate()+7*n);else d.setMonth(d.getMonth()+n);return localDate(d)}
function periodsSince(start,freq){const days=dayDiff(start,today());if(days<0)return -1;if(freq==='weekly')return Math.floor(days/7);const s=new Date(start+'T00:00:00'),t=new Date();return (t.getFullYear()-s.getFullYear())*12+(t.getMonth()-s.getMonth())-(t.getDate()<s.getDate()?1:0)}
function inDays(n){return n===0?'today':n===1?'tomorrow':n===-1?'yesterday':n<0?`${-n} days ago`:`in ${n} days`}
const back=(h='#more',l='More')=>`<p><a href="${h}">‹ ${l}</a></p>`;
const numIn=(name,label,val,extra='')=>`<label class="f"><span>${label}</span><input type="number" inputmode="decimal" step="any" name="${name}" value="${esc(val??'')}" ${extra}></label>`;
const txtIn=(name,label,val,ph='')=>`<label class="f"><span>${label}</span><input type="text" name="${name}" value="${esc(val??'')}" placeholder="${esc(ph)}"></label>`;
const dateIn=(name,label,val)=>`<label class="f"><span>${label}</span><input type="date" name="${name}" value="${esc(val||today())}"></label>`;
function catByName(n,fallbackBucket='Needs'){return D.categories.find(c=>!c.deleted&&c.name.toLowerCase()===n.toLowerCase())||D.categories.find(c=>!c.deleted&&c.bucket===fallbackBucket)}
function logExpense({amount,catName,date,accId,notes,extra={}}){const cat=catByName(catName);D.expenses.push({id:uid(),amount,currency:'birr',birr:amount,catId:cat?.id,date,method:'Cash',accId,layer:'Keep',notes,created:new Date().toISOString(),...extra});applyAccount(accId,-amount)}
function defaultAcct(){return accounts().find(a=>['cash','telebirr','bank'].includes(a.type))?.id||''}

/* ---------- Iqub (§4.6, §6.10) ---------- */
function iqubInfo(q){
  const N=Math.max(1,num(q.members)),C=num(q.contribution),M=Math.min(N,Math.max(1,num(q.myTurn)));
  const paid=sum(q.contributions||[],'amount'),total=N*C,pool=N*C;
  const turnDate=addPeriods(q.start,M-1,q.freq),endDate=addPeriods(q.start,N-1,q.freq);
  const received=!!q.payout,remaining=Math.max(0,total-paid);
  const pNow=periodsSince(q.start,q.freq),due=Math.max(0,Math.min(N,pNow+1))*C;
  const per=q.freq==='weekly'?52:12,apr=num(q.compareApr||24);
  const advance=Math.max(0,pool-M*C),saved=advance*apr/100*(N-M)/per;
  return {N,C,M,paid,total,pool,turnDate,endDate,received,remaining,due,behind:Math.max(0,due-paid),daysToTurn:dayDiff(today(),turnDate),advance,saved,apr,finished:paid>=total&&received};
}

let bizTab='stock';

function itemDays(it){return dayDiff(it.acquired||today(),today())}
function bizStats(){
  const items=live(D.items);const stock=sum(items,it=>num(it.qty)*num(it.cost));
  const yr=localDate(new Date(Date.now()-365*864e5)),m=thisMonth();
  const sales=items.flatMap(it=>(it.sales||[]).map(s=>({...s,it})));
  const cogsYr=sum(sales.filter(s=>s.date>=yr),s=>s.qty*num(s.unitCost??s.it.cost));
  const revM=sum(sales.filter(s=>ym(s.date)===m),'revenue'),profitM=sum(sales.filter(s=>ym(s.date)===m),s=>s.revenue-s.qty*num(s.unitCost??s.it.cost));
  const buysM=sum(items.flatMap(it=>it.buys||[]).filter(b=>ym(b.date)===m),b=>b.qty*b.unitCost);
  const markups=items.filter(it=>num(it.cost)>0).map(it=>(num(it.price)-num(it.cost))/num(it.cost));
  return {stock,cogsYr,turnover:stock>0?cogsYr/stock:null,revM,profitM,buysM,avgMarkup:markups.length?sum(markups)/markups.length:null,aging:items.filter(it=>num(it.qty)>0&&itemDays(it)>=30)};
}

  <label class="f"><span>Buys from</span><select name="location">${LOCS.map(l=>opt(l,l,s?.location||'Dubai')).join('')}</select></label>${txtIn('categories','What they bring',s?.categories,'e.g. shoes, phone accessories')}${txtIn('terms','Credit terms',s?.terms,'e.g. pay in 30 days, +20%')}
  <label class="f"><span>Notes</span><textarea name="notes">${esc(s?.notes||'')}</textarea></label><button class="btn primary block" type="submit">${s?'Save':'Add supplier'}</button></form>`,sh=>{
    $('#spf',sh).onsubmit=ev=>{ev.preventDefault();const v=formData(ev.target);if(!v.name.trim())return toast('Add a name');mutate(s?'Supplier updated':'Supplier added',()=>{if(s)Object.assign(s,v);else D.suppliers.push({id:uid(),...v})});closeSheet();if(after)setTimeout(after,250)}});
}
function itemForm(it=null){
  const restock=it&&num(it.qty)<=0;
  openSheet(it?(restock?'Restock':'Edit stock'):'Add stock',`<form id="itf">${txtIn('name','Item',it?.name,'e.g. Nike Air Force 1')}${txtIn('category','Category',it?.category,'e.g. shoes')}
  <label class="f"><span>Supplier</span><select name="supplierId">${opt('','—',it?.supplierId)}${live(D.suppliers).map(s=>opt(s.id,s.name,it?.supplierId)).join('')}${opt('__new','+ Add a new supplier','')}</select></label>
  <div class="grid3">${numIn('qty',it&&!restock?'Quantity left':'Quantity',restock?'':it?.qty??1)}${numIn('cost','Cost per unit',it?.cost)}${numIn('price','Selling price',it?.price)}</div>
  <div class="math" id="mkOut"></div>
  ${dateIn('acquired','Date bought',restock?today():it?.acquired)}
  ${!it||restock?`${acctSelect('accId',defaultAcct(),'Paid from')}
  <label class="check"><input type="checkbox" name="onCredit" id="onCredit"><span>Taken on credit from the supplier</span></label>
  <div id="crBox" hidden><div class="grid2">${numIn('owe','Amount I must repay','')}${numIn('days','Days until due',30)}</div><div class="math" id="crOut"></div></div>`:''}
  <label class="check"><input type="checkbox" name="crowded" ${it?.crowded?'checked':''}><span>Lots of people around me sell this too</span></label>
  <div class="btnrow"><button class="btn primary" type="submit" style="flex:1">${it&&!restock?'Save':'Add stock'}</button>${it?'<button type="button" class="btn danger" id="itDel">Write off</button>':''}</div></form>`,sh=>{
    const f=$('#itf',sh);
    const upd=()=>{const v=formData(f);const c=num(v.cost),p=num(v.price),q=num(v.qty);$('#mkOut',sh).textContent=c>0?`Markup ${pct((p-c)/c)} · profit ${birr((p-c)*q)} if all ${fmt(q)} sell · total cost ${birr(c*q)}`:'Enter cost and selling price to see markup';
      const cb=$('#crBox',sh);if(cb){cb.hidden=!v.onCredit;if(v.onCredit){const prin=c*q,owe=num(v.owe),days=Math.max(1,num(v.days));const apr=prin?(owe-prin)/prin*365/days:0;const roi=c?((p-c)*q-(owe-prin))/prin*365/days:0;$('#crOut',sh).innerHTML=owe>prin?`Effective APR ${pct(apr)}. If it all sells in ${days} days, your return is ${pct(roi)} a year — <strong class="${roi>apr?'pos':'neg'}">${roi>apr?'the credit pays for itself':'the markup doesn’t cover the credit'}</strong>.`:'Enter the amount you’ll repay (goods value plus fee).'}}};
    f.oninput=upd;f.onchange=e=>{if(e.target.name==='supplierId'&&e.target.value==='__new'){supplierForm(null,()=>itemForm(it))}upd()};upd();
    if(it)$('#itDel',sh).onclick=async()=>{if(await confirmSheet({title:'Write off this stock?',html:`<p>${esc(it.name)}: ${fmt(it.qty)} units at cost ${birr(num(it.qty)*num(it.cost))}.</p><p class="sub">Use this for goods that are damaged, lost or won’t sell.</p>`,ok:'Write off',danger:true})){mutate('Stock written off',()=>{it.writtenOff=(it.writtenOff||0)+num(it.qty);it.qty=0;it.status='written off'});closeSheet()}};
    f.onsubmit=ev=>{ev.preventDefault();const v=formData(f);const q=num(v.qty),c=num(v.cost);if(!v.name.trim()||q<=0&&!it||c<=0)return toast('Add the item, quantity and cost');
      mutate(it&&!restock?'Stock updated':'Stock added',()=>{
        let target=it;const base={name:v.name.trim(),category:v.category,supplierId:v.supplierId==='__new'?'':v.supplierId,cost:c,price:num(v.price),crowded:v.crowded};
        if(it&&!restock){Object.assign(it,base,{qty:q,acquired:v.acquired})}
        else{if(!target){target={id:uid(),sales:[],buys:[],...base,qty:0,acquired:v.acquired};D.items.push(target)}else Object.assign(target,base,{acquired:v.acquired});
          target.qty=num(target.qty)+q;target.status='in stock';target.buys=(target.buys||[]).concat([{date:v.acquired,qty:q,unitCost:c}]);
          if(v.onCredit){D.credits.push({id:uid(),supplierId:base.supplierId,itemId:target.id,date:v.acquired,principal:r2(c*q),owe:num(v.owe)||r2(c*q),due:addDays(v.acquired,num(v.days)||30),status:'open'})}
          else applyAccount(v.accId,-c*q)}
      });closeSheet()};
  });
}
function addDays(d,n){const x=new Date(d+'T00:00:00');x.setDate(x.getDate()+n);return localDate(x)}
function bizStream(){let s=live(D.streams).find(x=>x.type==='business'&&x.active!==false);if(!s){s={id:uid(),name:'Reselling / business',type:'business',cls:'auto',active:true};D.streams.push(s)}return s}
function sellForm(it){
  openSheet('Record a sale',`<form id="slf"><p class="sub">${esc(it.name)}: ${fmt(it.qty)} in stock, cost ${birr(it.cost)} each</p>
  <div class="grid2">${numIn('qty','Quantity sold',1,`max="${it.qty}"`)}${numIn('revenue','Total received (birr)',it.price)}</div><div id="slOut"></div>
  ${acctSelect('accId',defaultAcct(),'Received into')}${dateIn('date','Date')}
  <label class="check"><input type="checkbox" name="asIncome" checked><span>Log the profit as income (runs your deductions)</span></label>
  <button class="btn primary block" type="submit">Record sale</button></form>`,sh=>{
    const f=$('#slf',sh);let touched=false;
    const upd=e=>{if(e&&e.target.name==='revenue')touched=true;const v=formData(f);if(e&&e.target.name==='qty'&&!touched)f.revenue.value=num(v.qty)*num(it.price);const q=num(f.qty.value),rev=num(f.revenue.value),cost=q*num(it.cost),profit=rev-cost,days=Math.max(1,itemDays(it));
      $('#slOut',sh).innerHTML=`<div class="math">Revenue ${birr(rev)} − cost ${birr(cost)} = profit <strong class="${profit>=0?'pos':'neg'}">${birr(profit)}</strong>. ROI ${cost?pct(profit/cost):'—'} in ${days} days, about ${cost?pct(profit/cost*365/days):'—'} a year.</div>${profit>0&&f.asIncome.checked?pipelineHTML(profit,pipeline(profit,f.date.value)):''}`};
    f.oninput=upd;upd();
    f.onsubmit=ev=>{ev.preventDefault();const v=formData(f);const q=num(v.qty),rev=num(v.revenue);if(q<=0||q>num(it.qty))return toast(`Sell between 1 and ${fmt(it.qty)}`);
      const cost=r2(q*num(it.cost)),profit=r2(rev-cost);let net=0;
      mutate('Sale recorded',()=>{it.qty=num(it.qty)-q;if(it.qty<=0)it.status='sold';it.sales=(it.sales||[]).concat([{date:v.date,qty:q,revenue:rev,unitCost:num(it.cost)}]);
        if(v.asIncome&&profit>0){applyAccount(v.accId,cost);const st=bizStream();const p=pipeline(profit,v.date);const delta=r2(profit-p.d.charity-p.d.family);net=p.net;D.income.push({id:uid(),streamId:st.id,amount:profit,currency:'birr',birr:profit,date:v.date,ded:p.d,net:p.net,accId:v.accId,accDelta:delta,notes:`Sale: ${q} × ${it.name}`,saleOf:it.id,created:new Date().toISOString()});applyAccount(v.accId,delta)}
        else applyAccount(v.accId,rev)});
      closeSheet();setTimeout(()=>confirmSheet({title:'Reinvest it',html:`<p>${birr(cost)} of your working capital came back${profit>0?`, plus ${birr(profit)} profit`:''}.</p><p class="sub">Profits compound only if you don’t interrupt them. Default move: buy more stock that sells fast.</p>`,ok:'Restock now',cancel:'Later'}).then(y=>{if(y)itemForm(num(it.qty)>0?null:it)}),5400)};
  });
}

/* ---------- Insurance (§9.2) ---------- */
const PTYPES={health:'Health',life:'Life',property:'Fire & property',auto:'Auto (third-party is mandatory)',other:'Other'};
function viewInsurance(){
  const ps=live(D.policies).sort((a,b)=>(a.renewal||'9').localeCompare(b.renewal||'9'));const has=t=>ps.some(p=>p.type===t);const own=t=>live(D.assets).some(a=>a.type===t);
  const gaps=[];if(!has('health'))gaps.push('No health cover. One hospital stay can wipe out months of savings.');if(!has('life'))gaps.push('No life cover. Term life (500k–2M birr cover) costs about 3,000–10,000 birr a year through EIC or Nyala.');if(own('realestate')&&!has('property'))gaps.push('You own property without fire and property cover (about 0.3–0.5% of value a year).');if(own('vehicle')&&!has('auto'))gaps.push('You own a vehicle without auto cover. Third-party insurance is mandatory (2,500–5,000 birr a year).');if(!live(D.iddirs).length)gaps.push('No iddir recorded. For most Ethiopians it’s the first layer of protection.');
  return `${header('Insurance')}${back()}
  <div class="btnrow" style="margin-bottom:12px"><button class="btn primary" data-act="policyform">Add policy</button></div>
  ${ps.length?`<section class="panel"><ul class="list">${ps.map(p=>{const d=p.renewal?dayDiff(today(),p.renewal):null;return `<li class="item btnlike" data-act="policyform" data-id="${p.id}" tabindex="0" role="button"><div class="grow"><div class="t">${esc(PTYPES[p.type])}: ${esc(p.provider||'')}</div><div class="s">Covers ${birr(p.coverage||0)}, premium ${birr(p.premium||0)} ${p.freq==='monthly'?'a month':'a year'}</div><div class="s">${d===null?'':d<0?`<span class="tag bad">Expired ${fmtDate(p.renewal)}</span>`:d<=30?`<span class="tag amb">Renews ${inDays(d)}</span>`:`Renews ${fmtDate(p.renewal)}`}</div></div><span aria-hidden="true">›</span></li>`}).join('')}</ul></section>`:''}
  <section class="panel"><h2>Your protection gaps</h2>${gaps.length?`<ul>${gaps.map(g=>`<li>${g}</li>`).join('')}</ul>`:'<p class="sub mb0">No obvious gaps. Review once a year.</p>'}</section>`;
}
function policyForm(p=null){
  openSheet(p?'Edit policy':'Add policy',`<form id="pof"><label class="f"><span>Type</span><select name="type">${Object.entries(PTYPES).map(([k,l])=>opt(k,l,p?.type||'health')).join('')}</select></label>${txtIn('provider','Provider',p?.provider,'e.g. EIC, Nyala, employer')}
  <div class="grid2">${numIn('premium','Premium (birr)',p?.premium)}<label class="f"><span>Paid</span><select name="freq">${opt('yearly','Yearly',p?.freq||'yearly')}${opt('monthly','Monthly',p?.freq)}</select></label></div>${numIn('coverage','Coverage amount (birr)',p?.coverage)}${dateIn('renewal','Renewal date',p?.renewal)}<label class="f"><span>Notes</span><textarea name="notes">${esc(p?.notes||'')}</textarea></label>

/* ---------- Family obligation manager (§9.5) ---------- */
const FPURPOSE={medical:['Medical','need'],education:['Education','need'],living:['Living costs','need'],wedding:['Wedding / event','want'],lifestyle:['Lifestyle','want'],selfsuff:['Self-sufficiency (business, training)','invest'],other:['Other','want']};
function viewFamily(){
  const s=D.settings,m=thisMonth();const budget=num(s.familyBudget)||(s.familyMode==='monthly'?num(s.familyAmt):0);
  const fx=live(D.expenses).filter(e=>e.family);const thisM=fx.filter(e=>ym(e.date)===m);const pipe=sum(incomeIn(m),e=>e.ded?.family||0);const spent=sum(thisM,'birr')+pipe;
  const by=k=>sum(fx.filter(e=>FPURPOSE[e.family.purpose]?.[1]===k&&e.date>=localDate(new Date(Date.now()-365*864e5))),'birr');

  ${budget?`<div class="bar ${spent>budget?'r':spent>budget*.8?'a':''} mt"><span style="width:${Math.min(100,spent/budget*100)}%"></span></div>`:''}

function familyForm(){
  openSheet('Log family support',`<form id="faf"><label class="f"><span>Amount</span><input class="amount-in" type="number" inputmode="decimal" name="amount"></label>${txtIn('recipient','To whom','', 'e.g. Mom, my brother')}
  <label class="f"><span>Purpose</span><select name="purpose">${Object.entries(FPURPOSE).map(([k,[l]])=>opt(k,l,'living')).join('')}</select></label>${acctSelect('accId',defaultAcct(),'Paid from')}${dateIn('date','Date')}<button class="btn primary block" type="submit">Save</button></form>`,sh=>{

    $('#cpMsg',sh).onclick=async()=>{try{await navigator.clipboard.writeText($('#famMsg',sh).value);toast('Copied')}catch(e){$('#famMsg',sh).select();toast('Select all and copy')}};

/* ---------- Life: estate checklist, community capital, money beliefs, behavior (§9.6, §9.9, §9.11) ---------- */
const ESTATE=['I have a will (a lawyer charges about 2,000–5,000 birr)','All my assets are written down — including gold, USD, informal loans and iqub — so my family knows what I have','My life insurance has named beneficiaries','Someone I trust knows where my documents and gold are','I’ve considered transferring property to my children during my lifetime'];
const SCRIPTS=[['childhood','What did your family say or show you about money when you were young?'],['scarcity','When money is short, what do you feel and do first?'],['family','What do you believe you owe your family, and where does that belief come from?'],['inflation','How has losing money to inflation changed the way you save or spend?'],['display','When do you spend so others will see it? What are you hoping they’ll think?']];
function behaviorInsights(){
  const c=calc(),out=[];const tot=c.totalA||0;
  if(tot>0&&c.birrMoney/tot>.3)out.push(['Loss aversion',`${pct(c.birrMoney/tot)} of your assets sit in birr because it feels safe. It is losing about ${birr(c.inflLossYear)} a year. Safe-feeling and safe aren’t the same here.`]);
  const crowded=live(D.items).filter(i=>i.crowded&&num(i.qty)>0).length+live(D.streams).filter(s=>s.crowded).length;
  if(crowded)out.push(['Herding',`${crowded} of your products or streams are things many people around you also do. Crowded markets squeeze margins — look for a different product, customer or channel.`]);
  const yr=localDate(new Date(Date.now()-365*864e5));const wants=live(D.expenses).filter(e=>e.date>=yr&&catOf(e.catId).bucket==='Wants');const status=sum(wants.filter(e=>['Gadgets','Clothing','Social & gifts'].includes(catOf(e.catId).name)),'birr');
  if(status>0)out.push(['Status spending',`${birr(status)} went to gadgets, clothing and social spending this year. In gold at ${D.settings.goldAppr}% for 10 years that would be ${birr(status*Math.pow(1+D.settings.goldAppr/100,10))}.`]);
  return out;
}
function viewLife(){
