let imp=null;
function parseCSV(t){t=t.replace(/^﻿/,'');const first=t.split(/\r?\n/)[0]||'';const delim=[',',';','\t'].sort((a,b)=>first.split(b).length-first.split(a).length)[0];const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else{if(c==='"')q=true;else if(c===delim){row.push(f.trim());f=''}else if(c==='\n'){row.push(f.trim());rows.push(row);row=[];f=''}else if(c!=='\r')f+=c}}
  if(f||row.length){row.push(f.trim());rows.push(row)}return rows.filter(r=>r.some(x=>x))}
function parseDateLoose(s){s=String(s||'').trim();let m;if((m=s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/)))return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;if((m=s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/))){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`}const d=new Date(s);return isNaN(d)?null:localDate(d)}
function guessCol(h,re){const i=h.findIndex(x=>re.test(x));return i}
function viewImport(){
  if(!imp)return `${header('Import')}${back()}<section class="panel"><h2>Import Telebirr or bank history</h2><p class="sub">Export your transaction history as a CSV file, then load it here. You’ll match the columns and pick which rows to bring in. Nothing leaves your phone.</p><label class="btn primary"><input type="file" id="csvFile" accept=".csv,text/csv,text/plain" class="sr">Choose CSV file</label></section><p class="real">Dates are read as day/month/year unless the file uses year-month-day. Ethiopian-calendar dates aren’t converted — check the preview.</p>`;
  const h=imp.rows[0],body=imp.rows.slice(1);const cm=imp.map;
  const parsed=body.map((r,i)=>{const date=parseDateLoose(r[cm.date]);let amt=num(r[cm.amount]);let dir;if(cm.credit>=0&&num(r[cm.credit])){amt=num(r[cm.credit]);dir='in'}else if(cm.debit>=0&&num(r[cm.debit])){amt=num(r[cm.debit]);dir='out'}else if(cm.type>=0){dir=/in|credit|receiv|deposit|cash ?in/i.test(r[cm.type])?'in':'out';amt=Math.abs(amt)}else{dir=amt>=0?'in':'out';amt=Math.abs(amt)}const desc=cm.desc>=0?r[cm.desc]:'';const dup=[...live(D.expenses),...live(D.income)].some(e=>e.date===date&&Math.abs(e.birr-amt)<0.01&&(e.notes||'').includes(desc.slice(0,20)));return {i,date,amt,dir,desc,dup}}).filter(x=>x.date&&x.amt>0);
  imp.parsed=parsed;if(!imp.sel)imp.sel=new Set(parsed.filter(p=>!p.dup).map(p=>p.i));
  const colSel=(k,label,allowNone)=>`<label class="f"><span>${label}</span><select data-impcol="${k}">${allowNone?opt(-1,'— none —',cm[k]):''}${h.map((x,i)=>opt(i,x||'Column '+(i+1),cm[k])).join('')}</select></label>`;
  const nIn=parsed.filter(p=>imp.sel.has(p.i)&&p.dir==='in').length,nOut=parsed.filter(p=>imp.sel.has(p.i)&&p.dir==='out').length;
  return `${header('Import')}<p><a href="#import" data-act="impreset">‹ Choose another file</a></p>
  <section class="panel"><h2>Match the columns</h2><div class="grid2">${colSel('date','Date')}${colSel('desc','Description',true)}${colSel('amount','Amount')}${colSel('type','In/out column',true)}${colSel('credit','Money in column',true)}${colSel('debit','Money out column',true)}</div></section>
  <section class="panel"><h2>Bring in as</h2><div class="grid2"><label class="f"><span>Money out → category</span><select id="impCat">${D.categories.filter(c=>!c.deleted).map(c=>opt(c.id,c.name,imp.cat||'')).join('')}</select></label><label class="f"><span>Money in → stream</span><select id="impStream">${live(D.streams).map(s=>opt(s.id,s.name,imp.stream||'')).join('')}</select></label></div>
  <label class="check"><input type="checkbox" id="impPipe" ${imp.pipe!==false?'checked':''}><span>Run income deductions on money in</span></label><p class="sub">Imports don’t change account balances — your Telebirr balance already includes them.</p></section>
  <section class="panel"><div class="between"><h2 class="mb0">${parsed.length} rows</h2><span class="sub">${nIn} in, ${nOut} out selected</span></div>
  <ul class="list">${parsed.slice(0,300).map(p=>`<li class="item"><label class="check mb0" style="flex:1"><input type="checkbox" data-improw="${p.i}" ${imp.sel.has(p.i)?'checked':''}><span><span class="${p.dir==='in'?'pos':''}">${p.dir==='in'?'+':'−'}${fmt(p.amt,2)}</span> ${fmtDate(p.date)}<br><span class="sub">${esc(p.desc)}${p.dup?' <span class="tag amb">Looks like a duplicate</span>':''}</span></span></label></li>`).join('')}</ul>${parsed.length>300?'<p class="sub">Only the first 300 rows are shown; all selected rows import.</p>':''}
  <button class="btn primary block mt" data-act="impgo" ${nIn+nOut?'':'disabled'}>Import ${nIn+nOut} transactions</button></section>`;
}
function startImport(text){const rows=parseCSV(text);if(rows.length<2)return toast('That file has no rows');const h=rows[0].map(x=>x.toLowerCase());
  imp={rows,map:{date:Math.max(0,guessCol(h,/date|time/)),desc:guessCol(h,/desc|detail|narr|remark|name|party|reason/),amount:Math.max(0,guessCol(h,/amount|amt|value|birr|etb/)),type:guessCol(h,/^type|direction|dr\/cr|transaction type/),credit:guessCol(h,/credit|money in|received/),debit:guessCol(h,/debit|money out|paid|sent/)}};render()}

function plainText(h){const d=document.createElement('div');d.innerHTML=h;return d.textContent.replace(/\s+/g,' ').trim()}
function upcomingNotifications(){
  const s=D.settings;if(!s.notifyOn)return [];
  const out=[],now=Date.now();
  const at=(date,hhmm)=>{const [h,m]=String(hhmm||'09:00').split(':').map(Number);const d=new Date(date+'T00:00:00');d.setHours(h||0,m||0,0,0);return d.getTime()};
  const add=(id,date,time,title,body,route)=>{const t=at(date,time);if(t>now+60000)out.push({id,at:t,title,body,route:route||'#home'})};
  const c=calc();
  if(s.notifyDaily){const urgent=alertsFor(c).filter(a=>a[0]==='r'||a[0]==='a').map(a=>plainText(a[1])).slice(0,4);
    const pool=[s.why?'Remember why: '+s.why:null,'Log today’s income and spending. Even 5 birr counts.',...urgent,c.birrMoney>0?`Your birr is losing about ${birr(c.inflLossDay)} a day to inflation.`:null].filter(Boolean);
    for(let i=0;i<14;i++)add('daily_'+i,addDays(today(),i),s.notifyTime,'Vellum',pool[i%pool.length],'#home')}
  if(s.notifyEvents){
    if(c.buckets.gold>=1)add('gold',addDays(today(),1),'10:00','Convert your savings to gold',`${birr(c.buckets.gold)} is waiting in your gold envelope. Every day in birr costs you.`,'#money');
    for(const q of live(D.iqubs)){const i=iqubInfo(q);
      if(!i.received){add('iq30_'+q.id,addDays(i.turnDate,-30),'09:00','Iqub turn in a month',`${q.name}: you receive ${birr(i.pool)} on ${fmtDate(i.turnDate)}. Plan to put it into gold or stock.`,'#iqub');
        add('iq7_'+q.id,addDays(i.turnDate,-7),'09:00','Iqub turn in a week',`${q.name}: ${birr(i.pool)} is coming. Don’t let it turn into spending.`,'#iqub');
        add('iq0_'+q.id,i.turnDate,'09:00','Your iqub turn is today',`${q.name}: ${birr(i.pool)}. Record it in Vellum and convert it.`,'#iqub')}
      if(!i.finished&&i.paid<i.total){const next=addPeriods(q.start,Math.max(0,periodsSince(q.start,q.freq)+1),q.freq);add('iqc_'+q.id,addDays(next,-1),'18:00','Iqub contribution tomorrow',`${q.name}: ${birr(i.C)} due ${fmtDate(next)}.`,'#iqub')}}
    for(const r of live(D.recurring)){const m=thisMonth();let d=`${m}-${String(r.day).padStart(2,'0')}`;if(d<=today()){const n=new Date(d+'T00:00:00');n.setMonth(n.getMonth()+1);d=localDate(n)}add('rec_'+r.id,addDays(d,-1),'18:00','Bill due tomorrow',`${catOf(r.catId).name}: ${birr(r.amount)}${r.note?' ('+r.note+')':''}.`,'#expenses')}
    for(const p of live(D.policies).filter(p=>p.renewal)){add('pol30_'+p.id,addDays(p.renewal,-30),'09:00','Insurance renews in a month',`${PTYPES[p.type]}${p.provider?' with '+p.provider:''} renews ${fmtDate(p.renewal)}.`,'#insurance');add('pol7_'+p.id,addDays(p.renewal,-7),'09:00','Insurance renews in a week',`${PTYPES[p.type]} renews ${fmtDate(p.renewal)}.`,'#insurance')}
    for(const cr of live(D.credits).filter(x=>x.status==='open')){add('cr3_'+cr.id,addDays(cr.due,-3),'09:00','Supplier credit due soon',`${birr(cr.owe)} due ${fmtDate(cr.due)}.`,'#business');add('cr0_'+cr.id,cr.due,'09:00','Supplier credit due today',`${birr(cr.owe)} is due today.`,'#business')}
    for(const it of live(D.items).filter(x=>num(x.qty)>0&&x.acquired))for(const n of [30,60,90])add(`age${n}_`+it.id,addDays(it.acquired,n),'10:00',`Unsold for ${n} days`,`${it.name}: ${fmt(it.qty)} left, ${birr(num(it.qty)*num(it.cost))} of capital tied up.`,'#business');
    const nm=new Date();nm.setMonth(nm.getMonth()+1,1);add('month_'+localDate(nm).slice(0,7),localDate(nm),'09:00','New month','Check your goals and set this month’s gold target.','#plan');
  }

}

/* ---- Backups ---- */
async function dailyBackup(){const list=(await kvGet('backups'))||[];const d=today();if(list.some(b=>b.date===d))return;list.push({date:d,data:await pack(D)});while(list.length>7)list.shift();await kvSet('backups',list)}
async function rewriteBackups(){const list=(await kvGet('backups'))||[];const out=[];for(const b of list){try{const obj=typeof b.data==='string'?b.data:null;if(obj)out.push({date:b.date,data:await pack(JSON.parse(obj))})}catch(e){}}out.push({date:today()+' (now)',data:await pack(D)});await kvSet('backups',out.slice(-7))}
async function loadBackupList(){const el=$('#backupList');if(!el)return;const list=(await kvGet('backups'))||[];backupsCache=list;el.innerHTML=list.length?`<ul class="list">${list.slice().reverse().map(b=>`<li class="item"><div class="grow"><div class="t">${esc(b.date)}</div><div class="s">${typeof b.data==='string'?'Plain copy':'Encrypted copy'}</div></div><button class="btn small" data-restore="${esc(b.date)}">Restore</button></li>`).join('')}</ul>`:'<div class="sub">The first copy is made today.</div>';
  $$('[data-restore]',el).forEach(btn=>btn.onclick=async()=>{const b=backupsCache.find(x=>x.date===btn.dataset.restore);let obj;try{obj=typeof b.data==='string'?JSON.parse(b.data):JSON.parse(await decryptWithCurrent(b.data))}catch(e){return toast('This copy can’t be opened with the current passphrase')}previewImport(obj,'daily copy from '+b.date)})}
async function decryptWithCurrent(rec){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(rec.iv)},cryptoKey,unb64(rec.ct));return new TextDecoder().decode(pt)}
function download(name,text,type='application/json'){if(window.AndroidBridge&&AndroidBridge.saveFile){try{const ok=AndroidBridge.saveFile(name,type,text);toast(ok?'Saved to Downloads: '+name:'Could not save the file');return}catch(e){}}const blob=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function csvCell(v){v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function exportCSV(){
  const rows=[['type','date','category_or_stream','bucket','amount','currency','birr','charity','family','savings','debt','tax','net','method','notes']];
  live(D.income).forEach(e=>rows.push(['income',e.date,D.streams.find(s=>s.id===e.streamId)?.name,'',e.amount,e.currency,e.birr,e.ded?.charity,e.ded?.family,e.ded?.savings,e.ded?.debt,e.ded?.tax,e.net,'',e.notes]));
  live(D.expenses).forEach(e=>{const c=catOf(e.catId);rows.push(['expense',e.date,c.name,c.bucket,e.amount,e.currency,e.birr,'','','','','','',e.method,e.notes])});
  D.moves.filter(m=>m.kind==='goldbuy').forEach(m=>rows.push(['gold purchase',m.date,'Gold','Future',m.grams,'g gold',m.birr,'','','','','','','','price '+m.price]));
  D.payments.forEach(p=>rows.push(['debt payment',p.date,D.debts.find(d=>d.id===p.debtId)?.name,'',p.amount,'birr',p.amount,'','','','','','','','interest '+p.interest]));
  rows.push([]);rows.push(['ASSETS']);rows.push(['name','type','flavor','quantity','currency','birr_value','real_value','acquired']);
  live(D.assets).forEach(a=>rows.push([a.name,ATYPES[a.type]?.label,a.flavor,a.qty??'',a.type==='gold'?'g':a.currency||'birr',Math.round(assetBirr(a)),Math.round(assetReal(a)),a.acquired]));
  rows.push([]);rows.push(['DEBTS']);rows.push(['name','type','creditor','principal','balance','apr','payment','good_or_bad']);
  live(D.debts).forEach(d=>rows.push([d.name,DTYPES[d.type],d.creditor,d.principal,d.balance,d.apr,debtPay(d),d.good?'good':'bad']));
  download(`vellum-${today()}.csv`,'﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv');
}
function validateImport(o){return o&&typeof o==='object'&&o.settings&&Array.isArray(o.income)&&Array.isArray(o.expenses)&&Array.isArray(o.assets)&&Array.isArray(o.debts)}
async function previewImport(obj,src){
  if(obj&&obj.enc){if(!hasCrypto())return toast('Encrypted backup — open Vellum from its https address to restore it');const p=prompt('This backup is encrypted. Enter its passphrase:');if(!p)return;try{obj=JSON.parse(await decryptRec(obj,p));}catch(e){return toast('Wrong passphrase')}}
  if(!validateImport(obj))return toast('That file isn’t a Vellum backup');
  const ok=await confirmSheet({title:'Replace your data?',html:`<p>From ${esc(src)}:</p><ul><li>${live(obj.income).length} income entries</li><li>${live(obj.expenses).length} spending entries</li><li>${live(obj.assets).length} assets</li><li>${live(obj.debts).length} debts</li></ul><p class="neg">Everything currently in Vellum on this device will be replaced. You can undo right after.</p>`,ok:'Replace',danger:true});
  if(ok)mutate('Backup restored',()=>{D=migrate(obj)});
}

/* ---- Integrity ---- */
let integrityIssues=[];
function integrityCheck(){
  const iss=[];
  for(const e of live(D.income)){const t=sum(Object.values(e.ded||{}))+num(e.net);if(Math.abs(t-num(e.birr))>0.05)iss.push(`Income on ${e.date}: deductions + net (${fmt(t,2)}) don’t equal gross (${fmt(e.birr,2)}).`)}
  for(const a of live(D.assets)){if(!isFinite(assetBirr(a)))iss.push(`Asset “${a.name}” has an invalid value.`)}
  for(const d of live(D.debts)){if(!isFinite(num(d.balance))||num(d.balance)<0)iss.push(`Debt “${d.name}” has an invalid balance.`)}
  for(const e of live(D.expenses)){if(!isFinite(e.birr))iss.push(`Spending on ${e.date} has an invalid amount.`)}
  const b=buckets();const rawGold=sum(live(D.income),e=>e.ded?.savings||0)-sum(D.moves.filter(x=>x.bucket==='gold'),'birr');if(rawGold<-1)iss.push(`More gold was bought from the envelope than was saved into it (${birr(-rawGold)}). This is fine if you bought extra gold with other money.`);
  integrityIssues=iss.filter(x=>!x.includes('This is fine'));return iss;
}

/* ============================================================
   EVENT BINDING
   ============================================================ */
const byId=(arr,b)=>b&&b.dataset&&b.dataset.id?D[arr].find(x=>x.id===b.dataset.id):null;
function pickThen(list,label,fn){const L=list();if(!L.length)return toast('Nothing to choose yet');if(L.length===1)return fn(L[0]);openSheet(label,`<ul class="list">${L.map(x=>`<li class="item btnlike" data-pick="${x.id}" tabindex="0" role="button"><div class="grow"><div class="t">${esc(x.name)}</div></div><span aria-hidden="true">›</span></li>`).join('')}</ul>`,sh=>$$('[data-pick]',sh).forEach(li=>li.onclick=()=>fn(L.find(x=>x.id===li.dataset.pick))))}
const ACTIONS={
  notifyperm:()=>{try{AndroidBridge.requestNotificationPermission();setTimeout(()=>toast(AndroidBridge.notificationsAllowed()?'Notifications are allowed':'Allow notifications for Vellum in your phone settings'),1500)}catch(e){}},
  notifytest:()=>{try{AndroidBridge.testNotification('Vellum',D.settings.why||'Notifications are working. Log today’s money.')}catch(e){}},
  iqubform:b=>iqubForm(byId('iqubs',b)),iqubpay:b=>{const q=byId('iqubs',b);q?iqubPay(q):pickThen(()=>live(D.iqubs),'Which iqub?',iqubPay)},iqubpayout:b=>iqubPayout(byId('iqubs',b)),
  iddirform:b=>iddirForm(byId('iddirs',b)),iddirpay:b=>iddirPay(byId('iddirs',b)),iddirpayout:b=>iddirPayout(byId('iddirs',b)),
  itemform:b=>itemForm(byId('items',b)),sellitem:b=>{const it=byId('items',b);it?sellForm(it):pickThen(()=>live(D.items).filter(i=>num(i.qty)>0),'What did you sell?',sellForm)},
  supplierform:b=>supplierForm(byId('suppliers',b)),policyform:b=>policyForm(byId('policies',b)),familyform:()=>familyForm(),familymsg:()=>familyMsg(),
  skillform:b=>skillForm(byId('skills',b)),skillhours:b=>{const k=byId('skills',b);mutate(`+${b.dataset.h} hours`,()=>{k.hours=num(k.hours)+num(b.dataset.h)},{silent:true})},
  personform:b=>personForm(byId('community',b)),impgo:()=>doImport(),impreset:()=>{imp=null;render()},
  paycredit:b=>{const c=byId('credits',b);openSheet('Mark credit as paid',`<form id="pcf"><p>${birr(c.owe)} to repay.</p>${acctSelect('accId',defaultAcct(),'Paid from')}<button class="btn primary block" type="submit">Mark as paid</button></form>`,sh=>{$('#pcf',sh).onsubmit=ev=>{ev.preventDefault();const v=formData(ev.target);mutate('Supplier credit paid',()=>{c.status='paid';c.paidOn=today();applyAccount(v.accId,-num(c.owe))});closeSheet()}})},
  add:()=>openAdd(),addincome:()=>openAdd('income'),addexpense:()=>openAdd('expense'),buygold:()=>openAdd('gold'),transfer:()=>openAdd('transfer'),
  addasset:()=>assetForm(),adddebt:()=>debtForm(),paydebt:()=>payDebtForm(),addstream:()=>streamForm(),
  borrowtest:()=>{location.hash='#advisor';setTimeout(()=>{const d=$('[data-adv="borrow"]');if(d){d.open=true;runCalc($('form',d));d.scrollIntoView()}},60)},
  recurring:()=>recurringSheet(),categories:()=>categoriesSheet(),undo:()=>undo(),
  paytax:()=>{const b=buckets();openSheet('Record a tax payment',`<form id="taxPay"><label class="f"><span>Amount paid to ERCA</span><input class="amount-in" type="number" name="amount" value="${Math.floor(b.tax)}"></label>${acctSelect('accId',accounts()[0]?.id||'','Paid from')}<button class="btn primary block" type="submit">Record payment</button></form>`,sh=>{$('#taxPay',sh).onsubmit=ev=>{ev.preventDefault();const v=formData(ev.target);const a=num(v.amount);if(a<=0)return;mutate('Tax payment recorded',()=>{D.moves.push({id:uid(),kind:'tax',date:today(),birr:a,bucket:'tax'});applyAccount(v.accId,-a)});closeSheet()}})},
  raisecap:async()=>{const s=D.settings;if(await confirmSheet({title:'Raise your spending cap?',html:`<p>From ${birr(s.capMonthly)} to <strong>${birr(s.capMonthly+s.capIncrement)}</strong> a month.</p><p class="sub">Only raise it at a real breaking point. A fixed cap is how income turns into wealth.</p>`,ok:'Raise it'}))mutate('Cap raised',()=>{s.capMonthly+=s.capIncrement;s.capWeekly=s.capWeekly?Math.round(s.capMonthly/4):0})},
  exportjson:()=>{download(`vellum-backup-${today()}.json`,JSON.stringify(D,null,1));toast('Backup downloaded')},
  exportcsv:()=>exportCSV(),
  setpass:()=>passSheet(),
  removepass:async()=>{if(await confirmSheet({title:'Remove the lock?',html:'<p>Your data will be stored unencrypted on this device.</p>',ok:'Remove lock',danger:true})){cryptoKey=null;cryptoSalt=null;await saveNow();await rewriteBackups();render();toast('Lock removed')}},
  integrity:()=>{const i=integrityCheck();render();toast(i.length?`${i.length} issue(s) found`:'Everything reconciles')},
  wipe:async()=>{if(await confirmSheet({title:'Erase everything?',html:'<p class="neg">This permanently deletes all your Vellum data on this device, including the daily copies. It cannot be undone.</p><p>Download a backup first if you might want it later.</p>',ok:'Erase all data',danger:true,typed:'erase'})){await kvSet('state',null);await kvSet('backups',[]);try{localStorage.removeItem('vellum_state')}catch(e){}cryptoKey=null;location.hash='#home';location.reload()}}
};
function bindView(){
  const root=$('#root');
  $$('[data-act]',root).forEach(b=>{b.onclick=e=>{e.preventDefault();ACTIONS[b.dataset.act]?.(b)};if(b.tagName==='LI')b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();ACTIONS[b.dataset.act]?.(b)}}});
  $$('[data-biztab]',root).forEach(b=>b.onclick=()=>{bizTab=b.dataset.biztab;render()});
  $$('[data-estate]',root).forEach(c=>c.onchange=()=>mutate('Checklist updated',()=>{D.checklist[c.dataset.estate]=c.checked},{silent:true}));
  $$('[data-refl]',root).forEach(t=>t.onchange=()=>{D.reflections[t.dataset.refl]=t.value;save();toast('Saved')});
  const fb=$('#famBudget',root);if(fb)fb.onchange=()=>mutate('Family budget set',()=>{D.settings.familyBudget=num(fb.value)});
  const cf=$('#csvFile',root);if(cf)cf.onchange=async()=>{const f=cf.files[0];if(f)startImport(await f.text())};
  $$('[data-impcol]',root).forEach(s=>s.onchange=()=>{imp.map[s.dataset.impcol]=+s.value;imp.sel=null;render()});
  $$('[data-improw]',root).forEach(c=>c.onchange=()=>{const i=+c.dataset.improw;c.checked?imp.sel.add(i):imp.sel.delete(i);imp.cat=$('#impCat').value;imp.stream=$('#impStream').value;render()});
  $$('[data-mtab]',root).forEach(b=>b.onclick=()=>{moneyTab=b.dataset.mtab;render()});
  $$('[data-tab="debts"]',root).forEach(a=>a.onclick=()=>{moneyTab='debts'});
  $$('[data-rtab]',root).forEach(a=>a.onclick=()=>{reportTab=a.dataset.rtab});
  $$('[data-rtab2]',root).forEach(b=>b.onclick=()=>{reportTab=b.dataset.rtab2;render()});
  $$('[data-dorder]',root).forEach(b=>b.onclick=()=>{debtOrder=b.dataset.dorder;render()});
  $$('[data-efilter]',root).forEach(b=>b.onclick=()=>{expFilter=b.dataset.efilter;render()});
  const ep=$('#extraPay',root);if(ep)ep.onchange=()=>{extraPay=num(ep.value);render()};
  const open=(sel,fn)=>$$(sel,root).forEach(el=>{const go=()=>fn(el);el.onclick=go;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}});
  open('[data-edit-inc]',el=>{const e=D.income.find(x=>x.id===el.dataset.editInc);openSheet('Edit income','<div id="eb"></div>',sh=>incomeForm($('#eb',sh),e))});
  open('[data-edit-exp]',el=>{const e=D.expenses.find(x=>x.id===el.dataset.editExp);openSheet('Edit spending','<div id="eb"></div>',sh=>expenseForm($('#eb',sh),e))});
  open('[data-edit-asset]',el=>{const a=D.assets.find(x=>x.id===el.dataset.editAsset);if(a)return assetForm(a);const v=calc().assets.find(x=>x.a.id===el.dataset.editAsset);if(v)location.hash=v.a.link});
  open('[data-edit-debt]',el=>debtForm(D.debts.find(x=>x.id===el.dataset.editDebt)));
  open('[data-edit-stream]',el=>streamForm(D.streams.find(x=>x.id===el.dataset.editStream)));
  const gf=$('#goalsForm',root);if(gf)gf.onsubmit=e=>{e.preventDefault();const v=formData(gf);mutate('Goals saved',()=>Object.assign(D.goals,v))};
  const ct=$('#crisisToggle',root);if(ct)ct.onchange=()=>mutate(ct.checked?'Crisis mode on':'Crisis mode off',()=>{D.settings.crisis=ct.checked});
  const sf=$('#settingsForm',root);if(sf){sf.onchange=e=>{const el=e.target;if(!el.name)return;const v=el.type==='checkbox'?el.checked:(el.type==='number'?num(el.value):el.value);
    if(['inflation','usd','eur','gbp','goldPrice'].includes(el.name)&&v<=0&&el.name!=='inflation')return toast('That value must be above zero');
    D.settings[el.name]=v;if(['usd','eur','gbp','goldPrice','inflation'].includes(el.name))D.settings.ratesUpdated=today();
    if(el.name==='theme')applyTheme();upsertSnapshot();save();toast('Saved')}}
  $$('form[data-calc]',root).forEach(f=>{f.oninput=()=>runCalc(f);});
  $$('details[data-adv]',root).forEach(d=>d.addEventListener('toggle',()=>{if(d.open)runCalc($('form',d))}));
  $$('form[data-tax]',root).forEach(f=>{f.oninput=()=>runTax(f);runTax(f)});
  const imp=$('#importFile',root);if(imp)imp.onchange=async()=>{const file=imp.files[0];if(!file)return;try{previewImport(JSON.parse(await file.text()),file.name)}catch(e){toast('Couldn’t read that file')}imp.value=''};
  $$('[data-guide]',root).forEach(c=>c.onchange=()=>mutate(c.checked?'Day done':'Day unmarked',()=>{const i=+c.dataset.guide;D.guideDone=(D.guideDone||[]).filter(x=>x!==i);if(c.checked)D.guideDone.push(i)},{silent:true}));
  if(route()==='data')loadBackupList();
}
$('#addBtn').onclick=()=>openAdd();

function applyTheme(){const t=D?.settings.theme||'auto';if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t)}

/* ---- Onboarding ---- */
function onboarding(){
  $('#nav').hidden=true;
  $('#root').innerHTML=`<div class="app" style="padding-bottom:40px"><header class="top"><div class="brand">${LOGO}<span>Vellum</span></div></header>
  <h1>Your money, measured against inflation.</h1><p class="sub">Vellum tracks your income, spending, gold, debts and goals — and shows what birr is quietly losing every day. Everything stays on this phone.</p>
  <form id="obForm" class="panel mt">
  <label class="f"><span>Your name</span><input type="text" name="name" autocomplete="given-name"></label>
  <label class="f"><span>Why are you doing this?</span><textarea name="why" placeholder="I am building a future I look forward to."></textarea></label>
  <label class="f"><span>About how much do you earn a month? (birr, before deductions)</span><input type="number" inputmode="decimal" name="gross" placeholder="e.g. 40000"></label>
  <div class="sub" style="margin-bottom:6px">How do you earn? (pick all that apply)</div>
  <div class="chips">${Object.entries(STREAM_TYPES).slice(0,8).map(([k,l])=>`<label class="chip" style="display:inline-flex;align-items:center;gap:6px"><input type="checkbox" name="st_${k}" ${k==='business'?'checked':''}>${l}</label>`).join('')}</div>
  <label class="f"><span>Savings to gold from each income (%)</span><input type="number" name="pyf" value="15"></label>
  <label class="f"><span>Charity from each income (%)</span><input type="number" name="charity" value="10"></label>
  <label class="f"><span>Monthly spending cap (birr)</span><input type="number" name="cap" value="40000"></label>
  <button class="btn primary block" type="submit">Start using Vellum</button>
  <p class="real mt mb0">You can change all of this in Settings. Defaults: inflation 25%, 185 birr per USD, gold 12,000 birr per gram.</p></form></div>`;
  $('#obForm').onsubmit=e=>{e.preventDefault();const v=formData(e.target);const s=D.settings;s.name=v.name.trim();s.why=v.why.trim();s.grossMonthly=num(v.gross);s.pyfPct=num(v.pyf);s.pyfOn=num(v.pyf)>0;s.charityPct=num(v.charity);s.charityOn=num(v.charity)>0;s.capMonthly=num(v.cap)||40000;s.capWeekly=Math.round(s.capMonthly/4);
    Object.keys(STREAM_TYPES).forEach(k=>{if(v['st_'+k])D.streams.push({id:uid(),name:STREAM_TYPES[k],type:k,cls:'auto',active:true})});
    D.onboarded=true;upsertSnapshot();saveNow();if(isAndroid())try{AndroidBridge.requestNotificationPermission()}catch(e){}$('#nav').hidden=false;location.hash='#home';render();setTimeout(()=>assetForm(),400)};
}

/* ---- Lock screen ---- */
function lockScreen(rec){
  return new Promise(res=>{
    $('#root').innerHTML=`<div class="lock"><div class="brand" style="margin-bottom:18px">${LOGO}<span>Vellum</span></div><h1>Locked</h1><form id="unlock"><label class="f"><span>Passphrase</span><input type="password" name="p" autocomplete="current-password" autofocus></label><button class="btn primary block" type="submit">Unlock</button><p class="sub mt" id="lockErr" role="alert"></p></form></div>`;
    setTimeout(()=>$('#unlock input').focus(),50);
    $('#unlock').onsubmit=async e=>{e.preventDefault();const p=e.target.p.value;$('#lockErr').textContent='Unlocking…';try{const txt=await decryptRec(rec,p);res(JSON.parse(txt))}catch(err){$('#lockErr').textContent='That passphrase didn’t work. Try again.'}};
  });
}

/* ---- Boot ---- */
async function boot(){
  let raw=await kvGet('state');
  if(!raw){const ls=localStorage.getItem('vellum_state');if(ls)try{raw=JSON.parse(ls)}catch(e){}}
  if(raw&&typeof raw==='object'&&raw.enc){if(!hasCrypto()){$('#root').innerHTML='<div class="lock"><h1>Locked</h1><p>This data is encrypted. Open Vellum from its https address to unlock it.</p></div>';return}D=migrate(await lockScreen(raw))}
  else if(typeof raw==='string'){try{D=migrate(JSON.parse(raw))}catch(e){D=newState()}}
  else if(raw&&typeof raw==='object')D=migrate(raw);
  else D=newState();
  applyTheme();
  if(!D.onboarded)return onboarding();
  const added=runRecurring();upsertSnapshot();integrityCheck();save();
  if(D.settings.notifyOn&&isAndroid())try{AndroidBridge.requestNotificationPermission()}catch(e){}
  $('#nav').hidden=false;render();
  if(added)toast(`${added} recurring bill${added>1?'s':''} added`);
  dailyBackup();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
}
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
window.vellumBack=function(){if($('#confirm').classList.contains('on')){$('#cNo')?.click();return true}if($('#sheet').classList.contains('on')){closeSheet();return true}if(route()!=='home'){history.back();return true}return false};
boot();
